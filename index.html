<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Entry 66 stamp, meta form. Entry 157: build id lives here, never in the filename. -->
<meta name="template-id" content="TX-DASH-STANDARD-A-v1.0" />
<meta name="template-territory" content="TX" />
<meta name="template-family" content="DASH" />
<meta name="template-variant" content="STANDARD-A" />
<meta name="template-version" content="1.0" />
<title>Texas Physician Pilot - Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f2ec;--panel:#ffffff;--ink:#1d2733;--ink-soft:#4a5563;--ink-mute:#8791a0;--rule:#e6e0d5;--rule-soft:#efeae1;--law:#7a3b5e;--law-bg:#f5ebf0;--edu:#b5822a;--edu-bg:#f7efdd;--sci:#0f6068;--sci-bg:#e2f0ef;--primary:#0f5c5c;--primary-deep:#0a4144;--cr:#1E4B7C;--cr-bg:#E6EBF1;--accent:#c0632f;--verified:#2f7d5b;--coming:#a99f8d;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{height:100vh;display:flex;flex-direction:column;}
  .topbar{flex-shrink:0;background:linear-gradient(105deg,var(--primary-deep) 0%,var(--primary) 55%,#14706b 100%);color:#eaf4f2;padding:11px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .topbar .brand{display:flex;align-items:baseline;gap:12px;min-width:0;}
  .topbar .wordmark{font-family:'Fraunces',serif;font-weight:600;font-size:18px;letter-spacing:.02em;color:#fff;}
  .topbar .ctx{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#a6ccc7;white-space:nowrap;}
  .topbar .right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .clinic-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:5px 12px 5px 6px;}
  .clinic-chip .avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--edu),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;color:#fff;}
  .clinic-chip .cname{font-size:12px;font-weight:600;color:#fff;line-height:1.1;}
  .clinic-chip .csub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#a6ccc7;}
  .concept-badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;background:#ffe9b8;color:#6b4e15;border-radius:5px;padding:5px 9px;white-space:nowrap;}
  .thesis{flex-shrink:0;background:#fbf7ef;border-bottom:1px solid var(--rule);}
  .thesis-inner{padding:12px 26px;display:flex;gap:14px;align-items:flex-start;}
  .thesis .mark{width:30px;height:30px;border-radius:8px;background:var(--law-bg);color:var(--law);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
  .thesis .body{flex:1;min-width:0;}
  .thesis h3{margin:0 0 2px;font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--ink);}
  .thesis p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .thesis p b{color:var(--ink);font-weight:600;}
  .thesis .dismiss{background:none;border:1px solid var(--rule);color:var(--ink-mute);border-radius:6px;font-size:11px;padding:5px 10px;cursor:pointer;flex-shrink:0;font-family:'IBM Plex Mono',monospace;}
  .thesis.collapsed{display:none;}
  .reopen-bar{flex-shrink:0;background:#fbf7ef;border-bottom:1px solid var(--rule);display:none;}
  .reopen-bar.show{display:block;}
  .reopen-bar button{margin:0;padding:7px 26px;background:none;border:none;color:var(--law);font-size:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace;}
  .main-row{flex:1;min-height:0;display:grid;grid-template-columns:286px minmax(0,1fr) 448px;width:100%;}
  .rail{overflow-y:auto;height:100%;padding:18px 16px 30px;border-right:1px solid var(--rule);}
  .content{overflow-y:auto;height:100%;padding:20px 26px 40px;}
  .context{overflow-y:auto;height:100%;padding:20px 22px 40px;border-left:1px solid var(--rule);background:#faf7f1;}
  .rail-search{width:100%;border:1px solid var(--rule);background:var(--panel);border-radius:9px;padding:9px 12px;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .rail-sec{margin-bottom:18px;}
  .rail-sec > .lbl, .rail-collapse > summary > .lbl{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:600;border-radius:9px;padding:11px 13px;color:#fff;line-height:1.25;}
  .lbl .swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;background:rgba(255,255,255,.85);}
  .lbl.law{background:var(--law);}
  .lbl.edu{background:var(--edu);}
  .lbl.sci{background:var(--sci);}
  .lbl.coming{background:var(--edu);}
  .rail-item{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 11px;cursor:pointer;margin-bottom:3px;font-size:13px;color:var(--ink-soft);line-height:1.3;}
  .rail-item:hover{background:var(--panel);color:var(--ink);font-weight:600;}
  .rail-item.active{background:var(--panel);border-color:var(--rule);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,30,40,.05);}
  .rail-item .meta{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-mute);font-weight:400;margin-top:1px;}
  .rail-item.active.sci{border-left:3px solid var(--sci);}
  .coming-item{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border-radius:8px;margin-bottom:3px;opacity:.8;}
  .coming-item .nm{font-size:12.5px;color:var(--ink-mute);}
  .coming-item .soon{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;background:#efeae1;color:var(--coming);border-radius:4px;padding:2px 6px;text-transform:uppercase;}
  .rail-hint{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-mute);line-height:1.5;margin:6px 4px 0;}

  .sec-lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sci);margin:0 0 4px;font-weight:500;display:flex;align-items:center;gap:7px;}
  .sec-lbl .swatch{width:9px;height:9px;border-radius:3px;background:var(--sci);}
  .page-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;max-width:82ch;}

  /* indication accordion */
  .ind-panel{background:var(--panel);border:1px solid var(--rule);border-radius:13px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,40,.04);}
  .ind-panel > summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:13px;}
  .ind-panel > summary::-webkit-details-marker{display:none;}
  .ind-panel > summary .ind-dot{width:9px;height:9px;border-radius:50%;background:var(--sci);flex-shrink:0;}
  .ind-panel > summary .ind-name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--ink);line-height:1.2;}
  .ind-panel > summary .ind-meta{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-mute);font-weight:400;margin-top:2px;}
  .ind-panel > summary .chev{margin-left:auto;color:var(--ink-mute);transition:transform .2s;font-size:14px;}
  .ind-panel[open] > summary .chev{transform:rotate(90deg);}
  .ind-panel[open]{border-color:var(--sci);}
  .ind-panel[open] > summary{background:var(--sci-bg);}
  .ind-body{padding:16px 18px 18px;}
  .src-strip{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .src-strip .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:3px 8px;background:var(--sci-bg);color:var(--sci);}
  .src-strip .st-ttl{font-weight:600;font-size:13.5px;color:var(--ink);}
  .src-strip .st-code{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-mute);}
  .excerpt{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0 0 14px;max-width:96ch;}
  .lib-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 6px;}
  .lib-head .h{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);}
  .legend{display:flex;gap:14px;font-size:10.5px;color:var(--ink-mute);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;}
  .dot.av{background:var(--verified);} .dot.no{background:var(--coming);}
  .wrow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--rule-soft);}
  .wrow:last-of-type{border-bottom:none;}
  .wn{font-weight:600;font-size:13px;color:var(--ink);flex:1;}
  .st{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-mute);width:118px;}
  .act{font-family:'Inter',sans-serif;font-weight:600;font-size:11.5px;border:none;border-radius:7px;padding:7px 13px;cursor:pointer;white-space:nowrap;}
  .act.go{background:var(--primary-deep);color:#fff;}
  .act.off{background:#f0ece3;color:var(--ink-mute);cursor:not-allowed;}
  .ghl-note{background:var(--sci-bg);border-left:3px solid var(--sci);border-radius:0 8px 8px 0;padding:11px 14px;margin-top:14px;font-size:11.5px;color:#245a5a;line-height:1.5;}
  .ind-collapsed-note{font-size:12px;color:var(--ink-mute);}

  .announce{background:linear-gradient(135deg,#fff 0%,#fbf6ee 100%);border:1px solid var(--edu);border-radius:13px;overflow:hidden;margin:18px 0 15px;box-shadow:0 1px 3px rgba(20,30,40,.04);}
  .announce .a-head{padding:14px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--edu-bg);}
  .announce .a-head .ico{width:30px;height:30px;border-radius:8px;background:var(--edu-bg);color:var(--edu);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .announce .a-head .h{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  .announce .a-head .s{font-size:11px;color:var(--ink-mute);}
  .announce .a-body{padding:16px 18px;}
  .preview-card{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:12px;max-width:88ch;}
  .preview-card .clinic-line{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .preview-card .cl-av{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--edu),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;}
  .preview-card .cl-nm{font-weight:600;font-size:13px;}
  .preview-card .cl-loc{font-size:11px;color:var(--ink-mute);}
  .preview-card .msg{font-size:14px;line-height:1.6;color:var(--ink);}
  .preview-card .msg .hl{background:var(--edu-bg);border-radius:3px;padding:0 3px;}
  .mode-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .mode-tab{font-size:11.5px;font-weight:600;border-radius:7px;padding:7px 13px;cursor:pointer;border:1px solid var(--rule);background:#fff;color:var(--ink-soft);}
  .mode-tab.on{background:var(--edu-bg);border-color:var(--edu);color:var(--edu);}
  .mode-note{font-size:11px;color:var(--ink-mute);line-height:1.5;display:flex;gap:7px;max-width:96ch;}
  .mode-note .warn{color:var(--law);flex-shrink:0;}
  .foot-note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-mute);line-height:1.6;padding-top:14px;border-top:1px solid var(--rule);margin-top:6px;max-width:110ch;}
  .foot-note b{color:var(--ink-soft);}

  /* right context: poster + paired complement */
  .ctx-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 12px;font-weight:500;}
  .poster-card{border-radius:11px;overflow:hidden;border:1px solid var(--rule);box-shadow:0 2px 8px rgba(20,30,40,.1);background:#0a1020;position:relative;width:100%;margin-bottom:10px;}
  .poster-card img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;}
  .poster-card .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,32,0) 42%,rgba(10,16,32,.82) 100%);}
  .poster-card .badge{position:absolute;top:9px;left:9px;font-family:'IBM Plex Mono',monospace;font-size:8px;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:3px 7px;}
  .poster-card .cap-in{position:absolute;left:12px;right:12px;bottom:12px;color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:14px;line-height:1.25;}
  .ctx-poster-cap{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-mute);line-height:1.5;margin:0 0 10px;}
  .ctx-launch{width:100%;text-align:center;}
  .pair-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--law);margin:22px 0 10px;font-weight:500;display:flex;align-items:center;gap:7px;}
  .pair-lbl .swatch{width:9px;height:9px;border-radius:3px;background:var(--law);}
  .pair-note{font-size:11px;color:var(--ink-mute);line-height:1.5;margin:0 0 10px;}
  .ctx-card{background:#fff;border:1px solid var(--rule);border-radius:11px;padding:15px;box-shadow:0 1px 3px rgba(20,30,40,.04);}
  .ctx-card .tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:3px 7px;display:inline-block;margin-bottom:10px;background:var(--law-bg);color:var(--law);}
  .ctx-card h4{font-family:'Fraunces',serif;font-weight:600;font-size:15px;line-height:1.3;margin:0 0 8px;color:var(--ink);}
  .ctx-card p{font-size:12px;color:var(--ink-soft);line-height:1.55;margin:0 0 12px;}
  .ctx-fields{border-top:1px solid var(--rule-soft);padding-top:11px;}
  .ctx-fields .fld{display:flex;justify-content:space-between;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 0;}
  .ctx-fields .fld .k{color:var(--ink-mute);}
  .ctx-fields .fld .v{color:var(--ink-soft);text-align:right;}
  .ctx-openlink{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--law);text-decoration:underline;cursor:pointer;display:inline-block;margin-top:8px;}
  .ctx-attrib{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-mute);line-height:1.5;background:var(--rule-soft);border-radius:8px;padding:10px 12px;margin-top:12px;}
  .ctx-attrib b{color:var(--ink-soft);font-weight:500;}

  @media (max-width:1120px){.main-row{grid-template-columns:250px minmax(0,1fr);} .context{display:none;}}
  @media (max-width:760px){
    body{overflow:auto;}
    .app{height:auto;min-height:100vh;}
    .topbar{flex-wrap:wrap;gap:10px;padding:11px 16px;}
    .topbar .ctx{font-size:10px;white-space:normal;}
    .topbar .right{flex-wrap:wrap;justify-content:flex-start;width:100%;}
    .topbar .brand{flex-wrap:wrap;}
    .concept-badge{white-space:normal;}
    .thesis-inner{padding:12px 16px;flex-wrap:wrap;}
    .thesis .dismiss{order:3;}
    .main-row{display:block;}
    .rail{height:auto;overflow:visible;border-right:none;border-bottom:1px solid var(--rule);padding:16px;}
    .content{height:auto;overflow:visible;padding:18px 16px 30px;}
    /* content-library rows reflow so buttons never overflow */
    .wrow{flex-wrap:wrap;gap:6px 10px;}
    .wn{flex:1 1 100%;}
    .st{width:auto;}
    .act{margin-left:auto;}
    .ind-panel > summary{padding:13px 14px;}
    .ind-body{padding:14px;}
    .announce .a-body{padding:14px;}
    .narr-nav{flex-wrap:wrap;}
  }
  @media (max-width:400px){
    .act{font-size:11px;padding:6px 10px;}
    .ind-panel > summary .ind-name{font-size:15px;}
    .page-h,.reg-head h1{font-size:22px;}
  }

  .roadmap{margin-top:22px;background:linear-gradient(160deg,#fbf6ee 0%,#f5ecda 100%);border:1px solid var(--edu);border-radius:12px;padding:15px 16px;}
  .rm-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
  .rm-h{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;color:var(--ink);}
  .rm-tag{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.06em;text-transform:uppercase;background:var(--edu);color:#fff;border-radius:5px;padding:3px 7px;}
  .rm-sub{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 10px;}
  .roadmap ul{list-style:none;margin:0;padding:0;}
  .roadmap li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid rgba(181,130,42,.2);font-size:12px;color:var(--ink-soft);line-height:1.45;}
  .roadmap li:first-child{border-top:none;}
  .roadmap li .ic{color:var(--edu);flex-shrink:0;font-size:9px;line-height:1.7;}
  .rm-note{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-mute);line-height:1.5;margin:11px 0 0;border-top:1px solid rgba(181,130,42,.2);padding-top:9px;}

  .waitlist{margin-top:13px;border-top:1px solid rgba(181,130,42,.25);padding-top:13px;}
  .wl-h{font-family:'Fraunces',serif;font-weight:600;font-size:13.5px;color:var(--ink);margin:0 0 3px;}
  .wl-sub{font-size:11px;color:var(--ink-soft);line-height:1.45;margin:0 0 10px;}
  .wl-in{width:100%;border:1px solid var(--rule);background:#fff;border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-family:'Inter',sans-serif;}
  .wl-btn{width:100%;background:var(--edu);color:#fff;border:none;border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;}
  .wl-note{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-mute);margin:8px 0 0;text-align:center;}

  .opt-intake{margin-top:12px;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:12px 12px 11px;}
  .oi-h{font-family:'Fraunces',serif;font-weight:600;font-size:12.5px;color:var(--ink);margin:0 0 3px;}
  .oi-sub{font-size:10.5px;color:var(--ink-mute);line-height:1.45;margin:0 0 9px;}
  .oi-in{width:100%;border:1px solid var(--rule);background:#fff;border-radius:7px;padding:8px 10px;font-size:11.5px;color:var(--ink-soft);margin-bottom:7px;font-family:'Inter',sans-serif;}
  .oi-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:7px;padding:9px;font-family:'Inter',sans-serif;font-weight:600;font-size:11.5px;cursor:pointer;}
  .oi-note{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--ink-mute);margin:7px 0 0;text-align:center;}

  /* product-interest checkbox dropdown */
  .oi-drop{margin-bottom:8px;}
  .oi-drop > summary{list-style:none;cursor:pointer;border:1px solid var(--rule);background:#fff;border-radius:7px;padding:8px 10px;font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;}
  .oi-drop > summary::-webkit-details-marker{display:none;}
  .oi-cv{transition:transform .2s;font-size:10px;color:var(--ink-mute);}
  .oi-drop[open] > summary .oi-cv{transform:rotate(180deg);}
  .oi-check{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink);padding:7px 4px 0;cursor:pointer;}
  .oi-check input{accent-color:var(--sci);}
  /* waitlist collapsible */
  .waitlist-d{margin-top:13px;border-top:1px solid rgba(181,130,42,.25);padding-top:13px;}
  .wl-toggle{list-style:none;cursor:pointer;background:var(--edu);color:#fff;border-radius:8px;padding:10px;text-align:center;font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;}
  .wl-toggle::-webkit-details-marker{display:none;}
  .wl-form{padding-top:11px;}

  /* collapsible rail dropdowns */
  .rail-drop{margin-bottom:2px;}
  .drop-summary{list-style:none;display:flex;align-items:center;gap:6px;}
  .drop-summary::-webkit-details-marker{display:none;}
  .drop-summary .rdc{margin-left:auto;font-size:11px;color:var(--ink-mute);transition:transform .2s;}
  .rail-drop[open] > .drop-summary .rdc{transform:rotate(90deg);}

 "statutes": {
  "name": "Texas HB 810 (Charlie’s Law) &middot; Health &amp; Safety Code ch. 1003, subch. B",
  "meta": "Statute &middot; Effective September 1, 2017 &middot; amended by HB 5147 effective September 1, 2025",
  "intro": "Texas has a statutory framework for investigational stem cell treatments. Its eligibility conditions are specific and narrow. The provisions below are quoted directly from the law, not summarized or interpreted.",
  "currency": "Statutory text last verified 2026-08-29. The dates above are enactment and effective dates, not the date this page’s reading of the statute was checked.",
  "sections": [
   {
    "id": "st-def",
    "label": "Definitions",
    "lead": "Texas Health and Safety Code, Chapter 1003, Subchapter B, enacted as HB 810 effective September 1, 2017. The provision reads:",
    "quote": "Sec. 1003.051. DEFINITIONS. In this subchapter: (1) &quot;Investigational stem cell treatment&quot; means an adult stem cell treatment that: (A) is under investigation in a clinical trial and being administered to human participants in that trial; and (B) has not yet been approved for general use by the United States Food and Drug Administration. (2) &quot;Severe chronic disease&quot; means a condition, injury, or illness that: (A) may be treated; (B) is never cured or eliminated; and (C) entails significant functional impairment or severe pain. (3) &quot;Terminal illness&quot; means an advanced stage of a disease with an unfavorable prognosis that, without life-sustaining procedures, will soon result in death or a state of permanent unconsciousness from which recovery is unlikely.",
    "fine": "Provided by the State of Texas. This is not legal advice. Consult a legal or regulatory professional."
   },
   {
    "id": "st-elig",
    "label": "Patient eligibility",
    "lead": "Texas Health and Safety Code, Chapter 1003, Subchapter B, enacted as HB 810 effective September 1, 2017. The provision reads:",
    "quote": "Sec. 1003.053. PATIENT ELIGIBILITY. A patient is eligible to access and use an investigational stem cell treatment under this subchapter if: (1) the patient has a severe chronic disease or terminal illness listed in the rules adopted under Section 1003.052 and attested to by the patient’s treating physician; and (2) the patient’s physician: (A) in consultation with the patient, has considered all other treatment options currently approved by the United States Food and Drug Administration and determined that those treatment options are unavailable or unlikely to alleviate the significant impairment or severe pain associated with the severe chronic disease or terminal illness; and (B) has recommended or prescribed in writing that the patient use a specific class of investigational stem cell treatment.",
    "fine": "Provided by the State of Texas. This is not legal advice. Consult a legal or regulatory professional."
   },
   {
    "id": "st-prot",
    "label": "Informed consent",
    "lead": "Texas Health and Safety Code, Chapter 1003, Subchapter B, enacted as HB 810 effective September 1, 2017. The provision reads:",
    "quote": "Sec. 1003.054. INFORMED CONSENT. (a) Before receiving an investigational stem cell treatment, an eligible patient must sign a written informed consent. (b) If the patient is a minor or lacks the mental capacity to provide informed consent, a parent, guardian, or conservator may provide informed consent on the patient’s behalf. (c) The executive commissioner by rule may adopt a form for the informed consent under this section.",
    "fine": "Provided by the State of Texas. This is not legal advice. Consult a legal or regulatory professional."
   },
   {
    "id": "st-lic",
    "label": "Physician licence protection",
    "lead": "Texas Health and Safety Code, Chapter 1003, Subchapter B, enacted as HB 810 effective September 1, 2017. The provision reads:",
    "quote": "Sec. 1003.057. ACTION AGAINST PHYSICIAN’S LICENSE PROHIBITED. Notwithstanding any other law, the Texas Medical Board may not revoke, fail to renew, suspend, or take any action against a physician’s license under Subchapter B, Chapter 164, Occupations Code, based solely on the physician’s recommendations to an eligible patient regarding access to or use of an investigational stem cell treatment, provided that the care provided or recommendations made to the patient meet the standard of care and the requirements of this subchapter.",
    "fine": "Provided by the State of Texas. This is not legal advice. Consult a legal or regulatory professional."
   },
   {
    "id": "st-crim",
    "label": "Purchase and sale prohibited",
    "lead": "Texas Penal Code section 48.03, added by the same Act. The provision reads:",
    "quote": "Sec. 48.03. PROHIBITION ON PURCHASE AND SALE OF ADULT STEM CELLS FOR CERTAIN INVESTIGATIONAL TREATMENTS. (b) A person commits an offense if the person knowingly offers to buy, offers to sell, acquires, receives, sells, or otherwise transfers any adult stem cells for valuable consideration for use in an investigational stem cell treatment. (c) It is an exception to the application of this section that the valuable consideration is: (1) a fee paid to a physician or to other medical personnel for services rendered in the usual course of medical practice or a fee paid for hospital or other clinical services; (2) reimbursement of legal or medical expenses incurred for the benefit of the ultimate receiver of the investigational stem cell treatment; or (3) reimbursement of expenses of travel, housing, and lost wages incurred by the donor of adult stem cells in connection with the donation of the adult stem cells. (e) A violation of this section is a Class A misdemeanor.",
    "fine": "Provided by the State of Texas. This is not legal advice. Consult a legal or regulatory professional."
   },
   {
    "id": "st-amend",
    "label": "Amendment notice, read this first",
    "lead": "This section is a note from THINKER, not statutory text.",
    "quote": "The provisions quoted on this page are from HB 810 as enacted, effective September 1, 2017. HB 5147 amended Subchapter B effective September 1, 2025, changing the settings in which treatment may be provided, the criteria for institutional review boards, and reporting requirements. Section 1003.055, Treatment Requirements, is therefore not quoted here because the enacted 2017 text is no longer current. Verify the current text of the subchapter directly before relying on any provision.",
    "fine": "This note is provided by THINKER and is not statutory text. It is not legal advice. Consult a legal or regulatory professional."
   }
  ]

 "connectHTML": "<details class=\"sec-box cr-box2\" id=\"crSectionBox\" open><summary class=\"sec-box-head\">Clinical &amp; Regulatory<\/summary>\n        <div class=\"sec-box-body\">\n      <details class=\"ind-panel cr-panel\" id=\"crBox\">\n        <summary><span><span class=\"ind-name\">Connect with a professional<\/span><span class=\"ind-meta\">Regulatory &amp; clinical inquiries<\/span><\/span><span class=\"chev\">&#9656;<\/span><\/summary>\n        <div class=\"ind-body\">\n          <p class=\"excerpt\">Inquiring physicians can request to connect with a regulatory professional or a participating clinician. Clinical protocols are proprietary intellectual property; connect to inquire about arrangements. Email them directly.<\/p>\n          <div class=\"cr-form\">\n            <label class=\"cr-lbl\">I'd like to connect with<\/label>\n            <select class=\"cr-select\" id=\"crSelect\">\n              <option value=\"reg\">Regulatory professional, Brad Fox<\/option>\n              <option value=\"clin\" selected>Clinician, Dr. Felix Lurye, MD<\/option>\n              <option value=\"clin2\">Clinician, Lisa Speer, RN<\/option>\n              <option value=\"clin3\">Clinician, Stacy Wright, RN<\/option>\n            <\/select>\n            <div class=\"cr-who\" id=\"crWho\">\n              <span class=\"cr-name\">Dr. Felix Lurye, MD<\/span> <span class=\"cr-role\">Clinician<\/span>\n              <span class=\"cr-email\">[email]<\/span>\n            <\/div>\n            <label class=\"cr-lbl\">Your name<\/label><input class=\"cr-in\" placeholder=\"Your name\">\n            <label class=\"cr-lbl\">Your work email<\/label><input class=\"cr-in\" placeholder=\"you@practice.com\">\n            <label class=\"cr-lbl\">Your inquiry<\/label><textarea class=\"cr-in cr-ta\" placeholder=\"Briefly describe what you'd like to discuss (e.g. inquiring about arrangements)\"><\/textarea>\n            <button class=\"act go cr-send\">Send inquiry<\/button>\n            <p class=\"q-fine\">Protocols are proprietary intellectual property; this is an inquiry about arrangements, not a request for protocols. Concept, this form is non-functional and sends nothing.<\/p>\n          <\/div>\n        <\/div>\n      <\/details>\n        <\/div>\n      <\/details>",
 "contextHTML": "<div class=\"roadmap\">\n        <div class=\"rm-head-box\"><span class=\"rm-h\">Coming in the full version<\/span><span class=\"rm-tag\">Post-pilot<\/span><\/div>\n        <p class=\"rm-sub\">The pilot is the starting point. The full platform is planned to add:<\/p>\n        <ul>\n          <li><span class=\"ic\">&#9670;<\/span><span>Smart paid-ads integrations, Meta, Google, LinkedIn, TikTok, YouTube, and other platforms<\/span><\/li>\n          <li><span class=\"ic\">&#9670;<\/span><span>Video content generation<\/span><\/li>\n          <li><span class=\"ic\">&#9670;<\/span><span>Multiple landing pages per clinic, one for each campaign<\/span><\/li>\n          <li><span class=\"ic\">&#9670;<\/span><span>Discounts and deals from manufacturers and suppliers<\/span><\/li>\n          <li><span class=\"ic\">&#9670;<\/span><span>An automated system for continuous campaigns<\/span><\/li>\n          <li><span class=\"ic\">&#9670;<\/span><span>Automated B2B outreach to support organizations and adjacent groups, to expand reach<\/span><\/li>\n          <li><span class=\"ic\">&#9670;<\/span><span>Access to a medical community forum<\/span><\/li>\n          <li><span class=\"ic\">&#9670;<\/span><span>Hundreds of searchable scientific papers, each with generated outreach content<\/span><\/li>\n          <li><span class=\"ic\">&#9670;<\/span><span>An interactive AI chatbot on your landing pages<\/span><\/li>\n          <li><span class=\"ic\">&#9670;<\/span><span>New products and services<\/span><\/li>\n        <\/ul>\n        <p class=\"rm-note\">These capabilities are in development and are not part of the current pilot. They are not yet available, and we do not promise that they will all arrive at the same time.<\/p>\n        <details class=\"waitlist-d\">\n          <summary class=\"wl-toggle\">Join the waiting list<\/summary>\n          <div class=\"wl-form\">\n            <p class=\"wl-sub\">Be notified as full-version features become available.<\/p>\n            <input class=\"wl-in\" placeholder=\"Your name\" />\n            <input class=\"wl-in\" placeholder=\"Work email\" />\n            <button class=\"wl-btn\">Submit<\/button>\n            <p class=\"wl-note\">Design concept, form is non-functional.<\/p>\n          <\/div>\n        <\/details>\n      <\/div>\n\n      <p class=\"ctx-lbl\" style=\"margin-top:22px;\">Content preview<\/p>\n      <div class=\"poster-card\"><img id=\"ctxPosterImg\" src=\"\" alt=\"Illustrative social poster\"><div class=\"ov\"><\/div><div class=\"badge\">&#9432; Educational<\/div><div class=\"cap-in\">What the research actually shows<\/div><\/div>\n      <p class=\"ctx-poster-cap\">Social poster for the open source, one representative size. Image is illustrative.<\/p>"
};

      kind: 'Umbilical Cord Blood: An Overview',
      html: `<h4 class="pv-h">Sources</h4><p>1. Center for Biologics Evaluation and Research, FDA. Clinical and Statistical Joint Review, Hemacord (Hematopoietic Progenitor Cells - Cord Blood), BLA 125397. November 1, 2011.</p><p>2. Um S, Ha J, Choi SJ, Oh W, Jin HJ. Prospects for the therapeutic development of umbilical cord blood-derived mesenchymal stem cells. World Journal of Stem Cells. 2020;12(12):1511-1528.</p><p>3. Wang J, Metheny L. Umbilical cord blood derived cellular therapy: advances in clinical development. Frontiers in Oncology. 2023;13:1167266.</p><h4 class="pv-h">About These Sources</h4><p>This summary synthesizes three separate sources: one FDA regulatory review of an already-approved cord blood product, and two independent literature reviews covering cord blood research more broadly. It is not a summary of a single original study, and findings from each source should not be assumed to generalize to the others.</p><h4 class="pv-h">Key Findings</h4><p>FDA approval (Hemacord, 2011): the FDA's reviewer recommended full approval of Hemacord, a hematopoietic progenitor cell product derived from umbilical cord blood, for use in unrelated donor transplantation in patients with any of seven defined conditions: hematologic malignancy; Hurler syndrome; Krabbe disease; X-linked adrenoleukodystrophy; primary immunodeficiency disease in children who have failed conventional therapy; bone marrow failure that has failed conventional therapy; and beta thalassemia major in patients who have failed or cannot tolerate conventional therapy. This approval covers a defined set of serious conditions where the patient has generally already failed or cannot tolerate other options, not a general-purpose or first-line therapy.</p><p>Biological mechanisms (Um et al., 2020): cord blood-derived mesenchymal stem cells have been studied for a broad range of proposed mechanisms, including cell migration and homing, angiogenesis, anti-apoptotic activity, proliferation, anti-cancer activity, anti-fibrotic activity, anti-inflammatory activity, and tissue regeneration.</p><p>Active research areas (Wang &amp; Metheny, 2023): this review covers four areas of active cord blood-derived cellular therapy research: T-cell therapies, natural killer (NK)-cell therapies, refinements to cord blood stem cell transplantation itself, and cord-derived mesenchymal stem cell therapies. Specific results cited include a study of cord blood-derived regulatory T-cells in 11 patients undergoing cord blood transplantation, which reported a Grade II-IV acute graft-versus-host disease rate of 9% and no chronic graft-versus-host disease; and a Phase III randomized controlled trial (n=125) of an engineered cord blood product (omidubicel) against standard cord blood, which reported faster median neutrophil engraftment (10.0 days vs. 20.5 days) and lower non-relapse mortality at 210 days (11% vs. 24%).</p><h4 class="pv-h">Limitations</h4><p>The FDA approval is scoped narrowly to the seven conditions listed above, and within the largest of those populations (hematologic malignancy), the review's own dataset reported an early mortality rate of 26.6% and a primary graft failure rate of 16.3% (95% CI, 13.8-18.9%), both inversely correlated with the dose of cells transplanted. This approval does not extend to other uses.</p><p>Um et al. (2020) identify several unresolved concerns with cord blood-derived mesenchymal stem cells as a broader therapeutic platform: safety and tumorigenicity remain an active area of study rather than a settled question; there is no standardized isolation or culture protocol, which contributes to variability between preparations; isolation yield is limited (65%-90% depending on protocol); and manufacturing at clinical scale under GMP conditions remains a significant cost and scale-up barrier to wider use.</p><p>Wang and Metheny (2023) note that most of the clinical studies covered in their review are early-phase, and that many cord blood-derived cellular products are regulated as advanced therapy medicinal products (ATMPs) in both the US and the EU, a regulatory pathway with substantial complexity. Specific results such as the NK-cell studies cited above also report limited cell persistence (in one case, less than four weeks) as a continuing barrier to durable effect.</p><h4 class="pv-h">Overall Takeaway</h4><p>Taken together, these three sources describe cord blood as the basis for one FDA-approved, clinically established therapy for a defined set of serious conditions, and as the subject of active, earlier-stage research into a broader range of additional applications (including T-cell, NK-cell, and mesenchymal stem cell approaches). The approved use and the areas of ongoing research are distinct: none of the newer applications reviewed here should be read as an established, generally available treatment.</p>`,

      title: 'Layperson summary',
      kind: 'Umbilical Cord Blood: An Overview',
      html: `<p>This summary draws on three sources: a 2011 FDA scientific review of an approved cord blood-derived therapy, and two research review articles (published in 2020 and 2023) looking at cord blood research more broadly. Because it combines three different sources rather than reporting on one single study, it is a general overview rather than a report on one specific experiment.</p><h4 class="pv-h">What Is Established</h4><p>Cord blood, the blood left in the umbilical cord and placenta after a baby is born, contains cells that can be used medically. In 2011, the FDA gave full approval to a cord blood-derived product for use in transplants for patients with certain serious blood or immune conditions, including specific cancers of the blood, and a small number of specific inherited disorders. This approval applies to patients who generally have already tried, and not been helped by, other conventional treatments.</p><p>Separately, researchers have spent the years since studying whether cells from cord blood could be used in other ways too, including as a source of immune cells that might help fight cancer, or as a source of cells that might help repair or calm inflammation in the body. Some of this research has shown promising early results, such as lower rates of certain complications in small studies of transplant patients.</p><h4 class="pv-h">What This Does Not Mean</h4><p>The FDA approval described above covers a specific product for a specific, limited list of serious conditions. It is not a general approval of cord blood for other uses. The additional research areas described by the two review articles are still in earlier stages of study. The reviews themselves note that most of the related clinical studies are early-phase, that some approaches only produced effects that lasted a few weeks, and that bringing new cord blood-based therapies to market involves substantial regulatory and manufacturing hurdles. None of this newer research should be understood as describing an available, ready-to-use treatment.</p><h4 class="pv-h">The Question Worth Asking</h4><p>Cord blood already has one clearly established, FDA-approved medical use for a defined set of serious conditions, and continues to be an active area of scientific research beyond that. If you are weighing cord blood banking, or wondering whether cord blood is relevant to a condition in your family, ask your physician what it is and is not currently used for before you decide.</p>`,
      note: 'Prepared by The Thinker Intelligent System from cited public sources.'
    },

er use involves significant regulatory and manufacturing challenges. This information is general and educational, not a description of any specific clinic's services or a claim that any newer application is an available treatment.</p><h4 class="pv-h">Closing Variants</h4><p>1. The approved use covers a specific list of conditions. If you are wondering whether cord blood is relevant to a condition in your family, that is a conversation to have with your physician.</p><p>2. Considering cord blood banking? Ask your doctor what it is and is not currently used for before you decide.</p>`,

      kind: 'Umbilical Cord Blood: An Overview',
      html: `<h4 class="pv-h">Headline</h4><p>Cord Blood: What Is Approved, and What Is Still Early-Stage</p><h4 class="pv-h">Body</h4><p>Umbilical cord blood, the blood remaining in the umbilical cord and placenta after birth, has one clearly established medical use: in 2011, the FDA gave full approval to a cord blood-derived cell therapy for transplant use in patients with certain serious blood and immune conditions, and a small number of inherited disorders, typically after conventional treatment has failed.</p><p>Since then, researchers have continued to study cord blood-derived cells for a broader set of potential applications, including immune cell therapies studied in cancer treatment support and cell types studied for tissue repair and anti-inflammatory effects. Recent review articles describe encouraging early results in some of these areas, alongside open questions: most of the related clinical research remains early-phase, and translating it into widely available therapies involves real regulatory and manufacturing challenges that are still being worked through.</p><p>This is general educational information, not a description of any specific clinic's services. If you are weighing cord blood banking, or wondering whether cord blood is relevant to a condition in your family, ask your physician what it is and is not currently used for.</p>`,

    'koa-prof': {
      title: 'Professional summary',
      kind: 'Knee Osteoarthritis',
      html: `<h4 class="pv-h">Citation</h4><p>Park YB, Ha CW, Lee CH, Yoon YC, Park YG. Cartilage Regeneration in Osteoarthritic Patients by a Composite of Allogeneic Umbilical Cord Blood-Derived Mesenchymal Stem Cells and Hyaluronate Hydrogel: Results from a Clinical Trial for Safety and Proof-of-Concept with 7 Years of Extended Follow-Up. Stem Cells Translational Medicine. 2017;6(2):613-621.</p><h4 class="pv-h">Study Design</h4><p>First-in-human, single-arm, open-label trial evaluating the safety and proof-of-concept efficacy of a composite implant of allogeneic umbilical cord blood-derived mesenchymal stem cells (hUCB-MSCs) and hyaluronate hydrogel (Cartistem) for articular cartilage regeneration in osteoarthritic knees. Seven participants were enrolled and followed for 7 years.</p><h4 class="pv-h">Key Findings</h4><p>Maturing repair tissue was observed on arthroscopic evaluation at 12 weeks post-implantation. Visual Analogue Scale (VAS) and International Knee Documentation Committee (IKDC) subjective scores improved by 24 weeks, with improvements sustained through 7 years of follow-up. Histological evaluation at 1 year showed hyaline-like cartilage at the repair site. MRI at 3 years showed persistence of the regenerated cartilage.</p><h4 class="pv-h">Safety</h4><p>Five mild to moderate treatment-emergent adverse events were observed across the 7-year follow-up period. No cases of osteogenesis (abnormal bone formation) or tumorigenesis were reported over 7 years.</p><h4 class="pv-h">Limitations</h4><p>Small sample size (n = 7), single-arm design with no control or comparator group. As a first-in-human safety and proof-of-concept study, findings are hypothesis-generating and require confirmation in larger, controlled trials.</p><h4 class="pv-h">Authors' Conclusion</h4><p>The study's own significance statement describes the results as showing promising efficacy in terms of durable cartilage regeneration, while explicitly stating that results warrant further investigation with a larger number of patients.</p>`,
      note: 'Prepared by The Thinker Intelligent System from cited public sources.'
    },

    'koa-lay': {
      title: 'Layperson summary',
      kind: 'Knee Osteoarthritis',
      html: `<p>Researchers tested a treatment made from stem cells found in umbilical cord blood (the blood left in the umbilical cord after a baby is born, which is normally discarded). They combined these cells with a gel and placed them directly into the damaged cartilage of seven people with knee osteoarthritis, then followed those patients for 7 years.</p><h4 class="pv-h">What They Found</h4><p>Early signs of new cartilage tissue were visible about 3 months after treatment. Patients reported less pain and better knee function starting around 6 months, and this held up over the full 7 years researchers kept checking. Scans and tissue samples showed the new cartilage looked similar to healthy natural cartilage and was still there years later.</p><h4 class="pv-h">What This Does Not Mean</h4><p>This was a very small study (7 people) with no comparison group, so it cannot prove the treatment works for everyone or that it is better than other options. The researchers themselves describe it as an early, promising result that needs to be tested in larger studies before it can be considered a proven treatment.</p><h4 class="pv-h">The Question Worth Asking</h4><p>This is one early study showing encouraging results, not a green light to assume this treatment cures knee osteoarthritis. If you have knee osteoarthritis, ask your physician what the current evidence does and does not support for your specific case.</p>`,
      note: 'Prepared by The Thinker Intelligent System from cited public sources.'

    'koa-news': {
      title: 'Newsletter write-up',
      kind: 'Knee Osteoarthritis',
      html: `<h4 class="pv-h">Headline</h4><p>Seven Patients, Seven Years: What One Cartilage Study Found</p><h4 class="pv-h">Body</h4><p>In 2017, researchers published results from a first-in-human trial that placed a composite of allogeneic umbilical cord blood-derived mesenchymal stem cells and hyaluronate hydrogel directly into the damaged knee cartilage of seven patients with osteoarthritis. They then followed those patients for seven years.</p><p>Maturing repair tissue was visible on arthroscopic evaluation at 12 weeks. Pain and function scores improved by 24 weeks and were sustained through the full follow-up period. Tissue evaluation at one year showed hyaline-like cartilage at the repair site, and MRI at three years showed the regenerated cartilage was still present. Five mild to moderate adverse events were recorded across the seven years, with no abnormal bone formation and no tumor formation reported.</p><p>The study was small and single-arm, with no comparison group. Its authors describe the results as showing promising efficacy in terms of durable cartilage regeneration, while stating plainly that the findings warrant further investigation with a larger number of patients.</p><p>This is general educational information, not a description of any specific clinic's services. If you have knee osteoarthritis, ask your physician what the current evidence does and does not support for your specific case.</p>`,

  'wounds-prof': {
    title: 'Professional summary',
    kind: 'Wound Care',
    html: `<h4 class="pv-h">Sources</h4><p>1. Suzdaltseva Y, Zhidkih S, Kiselev SL, Stupin V. Locally Delivered Umbilical Cord Mesenchymal Stromal Cells Reduce Chronic Inflammation in Long-Term Nonhealing Wounds: A Randomized Study. Stem Cells International. 2020;2020:5308609. DOI 10.1155/2020/5308609.</p><p>2. Low Wang CC, Chong T, Moore G, Echalier B, Haakonsen N, Carter JE Jr, Mathes D, Hsia J, Phan TT, Lim IJ, Freed BM. Results of the Phase 1 Open-Label Safety Study of Umbilical Cord Lining Mesenchymal Stromal/Stem Cells (Corlicyte) to Heal Chronic Diabetic Foot Ulcers. Biomedicines. 2024;12(6):1375. DOI 10.3390/biomedicines12061375. ClinicalTrials.gov NCT04104451.</p><h4 class="pv-h">About These Sources</h4><p>Two human studies with different designs, different cell sources and different delivery routes. Findings from one should not be assumed to generalize to the other.</p><p>Suzdaltseva 2020 used mesenchymal stromal cells isolated from umbilical cord tissue, specifically Wharton's jelly, obtained by collagenase and dispase digestion of cord tissue after full-term delivery. Cells were injected locally around and inside the wound. Low Wang 2024 used cells derived from umbilical cord lining tissue, applied topically to the wound surface. Neither used umbilical cord blood-derived cells.</p><h4 class="pv-h">Study Design</h4><p><b>Suzdaltseva 2020.</b> Open, randomized, placebo-controlled pilot study at a single hospital in Moscow. One hundred eight patients with chronic wounds of mixed etiology were randomized to a single local injection of 2 x 10 to the 7th allogeneic cord tissue MSCs plus standard care (59 patients) or saline plus standard care (49 patients). Both arms received four weeks of standard treatment before randomization. Wound etiologies: trophic ulcers 36.1%, diabetic foot 28.7%, poorly granulating mixed-pathology wounds 29.6%, pressure ulcers 3.7%. Mean age 60 years, mean ulcer duration 9 months, range 4 weeks to 24 months. Assessment at 2 and 4 weeks, observation to one year.</p><p><b>Low Wang 2024.</b> Single-center, single-arm, open-label phase 1 dose-escalation study at the University of Colorado Hospital Wound Clinic, conducted under a US FDA Investigational New Drug Application. Cells applied topically twice weekly for up to eight weeks after debridement. Nine of sixteen consented subjects completed; a third planned dosing cohort was never enrolled.</p><h4 class="pv-h">Key Findings</h4><p><b>Suzdaltseva 2020.</b> Baseline wound areas were comparable between groups. At four weeks, median wound area was 15.75 square centimetres in the treated group against 27.60 in placebo, p less than 0.01. Wound healing rate over days 1 to 14 was 2.19 percent per day against 0.73 percent, p less than 0.01. Complete closure or greater than 90 percent reduction occurred in 22 percent of treated patients against 8.2 percent of placebo. Negative or insignificant outcomes occurred in 8.5 percent of treated patients against 32.6 percent of placebo.</p><p>Granulation tissue formation differed significantly by chi-squared test at 14 days. Microcirculation improved: average blood perfusion rose to 1.41 perfusion units in the treated group against 0.92 in placebo, and transcutaneous oxygen pressure rose from 20.5 to 30.7 mmHg against 21.6 to 23.9 in placebo.</p><p><b>Low Wang 2024.</b> No subject developed a serious adverse reaction to the product or anti-HLA antibodies. No ulcer increased in size during treatment. Three of five subjects in the lower dose cohort achieved closure by Day 70. Mean ulcer area fell from 2.38 to 0.66 square centimetres in Cohort A and 0.88 to 0.35 in Cohort B, both p less than 0.05.</p><h4 class="pv-h">Safety</h4><p>Suzdaltseva 2020 preceded the wound study with a safety phase in 30 healthy volunteers receiving a single intradermal injection, with no local or systemic adverse reactions observed at 1 day, 2, 4 and 12 weeks. In the wound study, no adverse effects were observed within a day of treatment, and one-year follow-up revealed no prominent adverse events or long-term complications.</p><p>Low Wang 2024 recorded twelve adverse events in six of nine subjects, all deemed unlikely related to the product, including one serious adverse event, a pneumonia requiring hospitalisation. No subject had an adverse reaction to the study drug.</p><h4 class="pv-h">Limitations</h4><p><b>Suzdaltseva 2020.</b> The study was open-label, not blinded: patients and assessors knew which arm each patient was in. This matters because the granulation tissue endpoint was a semiquantitative visual score. The authors describe it as a pilot study. It was conducted at a single centre, registered under a Russian Federal Service certificate rather than an international trial registry, and its primary data are restricted by the ethics committee rather than openly available. The authors note that treatment success depended considerably on wound size, stage, degree of arterial hemodynamic disorder and level of bacterial infection.</p><p><b>Low Wang 2024.</b> The authors identify small sample size and absence of a control group as the main limitations, noting that as a phase 1 first-in-human study an initial demonstration of safety was necessary before a larger trial. Efficacy measures were secondary endpoints in an uncontrolled study. The trial was funded by CellResearch Corporation through a contract with the University of Colorado, and two authors are co-founders and employees of that company; the published statement records the funder had no role in design, analysis or the decision to publish.</p><h4 class="pv-h">Overall Takeaway</h4><p>Suzdaltseva 2020 is the stronger of the two by design, being randomized with a placebo comparison across 108 patients, and its most notable result may be the difference in poor outcomes rather than good ones: 8.5 percent of treated patients had negative or insignificant improvement against 32.6 percent of placebo. It is nonetheless an open-label pilot at a single centre.</p><p>Low Wang 2024 is smaller and uncontrolled but was conducted under US FDA oversight with independent verification of wound measurements. Neither study establishes efficacy definitively, and both authors state that larger confirmatory trials are required.</p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'wounds-lay': {
    title: 'Layperson summary',
    kind: 'Wound Care',
    html: `<p>This summary draws on two published studies of cells taken from donated umbilical cord tissue, used to help wounds that have stopped healing on their own. The two studies used different parts of the cord, different ways of delivering the cells, and different study designs, so their results should be read separately rather than added together.</p><h4 class="pv-h">What They Found</h4><p>The larger study, published in 2020, involved 108 people in Moscow whose wounds had not healed for an average of nine months. Everyone received standard wound care for four weeks first. Then half received a single injection of cells around and inside the wound, and half received a saline injection instead.</p><p>Four weeks later, wounds in the cell group were about half the size of those in the comparison group. Perhaps the more striking result is what did not happen: wounds that got worse or barely improved occurred in about 9 percent of the cell group compared with about 33 percent of the comparison group. Patients were followed for a year with no notable problems reported.</p><p>A smaller 2024 study in Colorado, run under United States Food and Drug Administration oversight, applied cells directly onto diabetic foot ulcers in nine people. No one had a harmful reaction, no ulcer got bigger during treatment, and three of five people in one group had their ulcer close completely.</p><h4 class="pv-h">What This Does Not Mean</h4><p>In the larger study, everyone knew who was receiving cells and who was not, including the doctors assessing the wounds. That can influence how results are judged, particularly when part of the assessment involves looking at a wound and scoring it. The authors call it a pilot study, it was done at one hospital, and the underlying data are not publicly available.</p><p>The smaller study had nine people and no comparison group at all, so it cannot show whether the treatment worked better than standard care. Its main purpose was safety. It was funded by the company that makes the product.</p><p>Neither study settles whether this approach works. Both sets of authors say larger trials are needed.</p><h4 class="pv-h">The Question Worth Asking</h4><p>If you have a wound that has not healed for months, ask your physician what standard options remain for your specific situation, and whether research like this has any bearing on your case. Chronic wounds differ enormously in cause and severity, and both studies found that results depended heavily on wound size, circulation and infection.</p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'wounds-email': {

irculation and infection level. A separate 2024 study under United States Food and Drug Administration oversight tested a related approach in nine patients, but had no comparison group. Neither study establishes that this approach works, and both sets of authors state that larger trials are required. This is general educational information, not a description of any specific clinic's services.</p><h4 class="pv-h">Closing Variants</h4><p>1. If you have a wound that has not healed for months, ask your physician what standard options remain for your situation and whether research like this has any bearing on your case.</p><p>2. Chronic wounds differ enormously in cause and severity. The person who can tell you what applies to yours is the physician who has seen it.</p>`,

  'wounds-news': {
    title: 'Newsletter write-up',
    kind: 'Wound Care',
    html: `<h4 class="pv-h">Headline</h4><p>108 Patients: What a Randomized Study Found About Wounds That Will Not Close</p><h4 class="pv-h">Body</h4><p>Chronic wounds are wounds that stop healing. They can follow diabetes, poor circulation, nerve damage or prolonged pressure, and they often persist for months despite intensive care.</p><p>In 2020, researchers in Moscow published a randomized, placebo-controlled study of 108 patients whose wounds had persisted for an average of nine months. Every patient received four weeks of standard care first. Fifty-nine then received a single local injection of mesenchymal stromal cells derived from donated umbilical cord tissue; forty-nine received saline. Four weeks later, median wound area in the treated group was 15.75 square centimetres against 27.60 in the comparison group. Wounds that worsened or barely improved occurred in 8.5 percent of the treated group against 32.6 percent of the comparison group. Follow-up continued for a year with no prominent adverse events reported.</p><p>A separate 2024 study, conducted under United States Food and Drug Administration oversight at the University of Colorado, applied cord lining cells topically to chronic diabetic foot ulcers in nine patients. Safety was the primary question and no harmful reactions occurred, though the study had no comparison group.</p><p>Both studies have real limits. The larger one was open-label, meaning everyone knew who received what, and its authors describe it as a pilot conducted at a single hospital. The smaller one was uncontrolled and industry-funded. Both sets of authors state that larger trials are needed before conclusions can be drawn.</p><p>This is general educational information, not a description of any specific clinic's services. If you have a wound that has not healed for months, ask your physician what the current evidence does and does not support for your situation.</p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'alopecia-prof': {
    title: 'Professional summary',
    kind: 'Alopecia',
    html: `<h4 class="pv-h">Source</h4><p>Oh HA, Kwak J, Kim BJ, Jin HJ, Park WS, Choi SJ, Oh W, Um S. "Migration Inhibitory Factor in Conditioned Medium from Human Umbilical Cord Blood-Derived Mesenchymal Stromal Cells Stimulates Hair Growth." <i>Cells.</i> 2020;9(6):1344. DOI 10.3390/cells9061344. Open access (CC BY 3.0).</p><h4 class="pv-h">What Was Tested</h4><p>The intervention was a topical lotion, not an injected cell therapy. Conditioned medium was collected from human umbilical cord blood-derived mesenchymal stromal cells, and a primed version (P-CM) was produced by exposing those cells to TGF-beta1 and LiCl. The finished agent contained 5 percent P-CM. It was applied to the scalp, 1 to 2 mL twice daily, massaged in for 1 to 2 minutes. The cells themselves were not administered; what was applied is what the cells secrete into their culture medium.</p><h4 class="pv-h">Study Design</h4><p>Two-part study. The first part is laboratory work: conditioned medium, including the primed version, tested on human dermal papilla cells in culture.</p><p>The second part is clinical. The 5 percent P-CM agent was tested against a placebo containing 5 percent DPCM in a double-blind, placebo-controlled trial. Thirty patients completed the 16-week primary arm, sixteen receiving P-CM and fourteen placebo; two withdrew. Hair density, thickness and growth rate were measured by phototrichogram (Folliscope 4.0) at baseline, 4, 8 and 16 weeks.</p><p>A separate double-blind placebo-controlled trial of 52 patients ran to 24 weeks to assess longer-term effect. Nine were excluded for dyeing their hair or using other hair restorers; 43 completed, 25 receiving P-CM and 18 placebo. Approved by the KC Skin Research Center, IRB KC-IRB-018.</p><p>Population of the 16-week arm: adults aged 20 to 60 with mild-to-moderate patterned hair loss, males Norwood-Hamilton Type II, women Ludwig Type I. Mean age 46.9 years, range 33 to 55. Twenty-nine of thirty participants were female. No participant had used products or drugs expected to influence hair growth for at least six months prior.</p><h4 class="pv-h">Key Findings</h4><p>In cell culture, primed conditioned medium improved the viability of dermal papilla cells, which help regulate the hair growth cycle. The mechanism identified centres on macrophage migration inhibitory factor (MIF), which appeared to help dermal papilla cells increase VEGF, alongside beta-catenin and GSK-3 beta signalling.</p><p>In the 16-week arm, mean hair density in the P-CM group rose from 96.69 to 110.06 hairs per square centimetre, an increase of 14.24 percent (p&lt;0.001), while the placebo group fell from 114.64 to 108.07. Mean hair growth rate rose from 0.262 to 0.312 mm per day, an increase of 19.54 percent (p&lt;0.001), while the placebo group fell from 0.257 to 0.241. Both increases were statistically significant compared with placebo (p&lt;0.001).</p><p>Mean hair thickness rose from 0.074 to 0.094 mm, an increase of 28.19 percent (p&lt;0.001). The paper notes that between-group thickness differences were not statistically significant across the study period, though at 16 weeks the treated group did show a significant increase over control (p&lt;0.001).</p><p>In the separate 24-week cohort, the paper reports a significant increase in hair density in the P-CM groups.</p><h4 class="pv-h">Safety</h4><p>No severe adverse effects. No patient reported irritation or itching. Toxicity studies were conducted pursuant to Korean MFDS guidelines for cosmetic products.</p><h4 class="pv-h">Cell Source</h4><p>Umbilical cord blood-derived mesenchymal stromal cells. Cord blood, not cord tissue, and the administered product is the secretome rather than the cells. IRB MP-2015-06, MEDIPOST Co. Ltd.</p><h4 class="pv-h">Limitations</h4><p>The mechanistic findings come from cell culture, not from patients.</p><p>Twenty-nine of the thirty participants in the primary arm were female, so the findings rest almost entirely on a female population despite the condition affecting both sexes. Mean age was 46.9 with a range of 33 to 55, so the result does not speak to younger or older patients. Participants had mild-to-moderate hair loss only.</p><p>The agent was tested as a cosmetic formulation under Korean MFDS guidelines rather than as a drug. The thickness result should not be presented as a flat improvement over placebo; between-group significance was reached only at the 16-week timepoint.</p><h4 class="pv-h">Authors' Conclusion</h4><p>The paper frames this as an early mechanistic and pilot-stage result: conditioned medium from primed umbilical cord blood-derived mesenchymal stromal cells may support hair-growth-related activity through MIF, VEGF and beta-catenin signalling, with encouraging but preliminary human data.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'alopecia-lay': {
    title: 'Layperson summary',
    kind: 'Alopecia',
    html: `<h4 class="pv-h">What This Study Looked At</h4><p>Researchers studied a liquid collected from umbilical cord blood stem cells grown in a laboratory. Not the cells themselves, but the fluid those cells release as they grow, which carries the signalling molecules they produce.</p><p>That fluid was made into a scalp lotion, 5 percent strength. People applied it themselves, 1 to 2 mL twice a day, massaged in for a minute or two. Nothing was injected.</p><h4 class="pv-h">How It Was Tested</h4><p>Thirty people finished the main 16-week study. Sixteen used the real lotion and fourteen used a placebo, and neither the participants nor the researchers knew who had which until the study ended. Hair was measured with a scalp camera at the start and again at 4, 8 and 16 weeks.</p><h4 class="pv-h">What They Found</h4><p>Hair density in the treated group went up about 14 percent, from roughly 97 to 110 hairs per square centimetre. In the placebo group it went down. Hair growth rate went up about 20 percent in the treated group and down in the placebo group. Both of those differences held up against placebo.</p><p>Hair thickness rose about 28 percent in the treated group. That figure needs care: across the study as a whole, the difference between the treated and placebo groups was not statistically significant, and it only became significant at the 16-week mark.</p><p>A second, separate study of the same kind followed 43 people for 24 weeks and also found increased hair density.</p><p>In the laboratory part of the study, the fluid improved the health of dermal papilla cells, the cells that help control the hair growth cycle.</p><h4 class="pv-h">Safety</h4><p>Nobody reported a severe side effect. Nobody reported irritation or itching.</p><h4 class="pv-h">What This Doesn't Mean</h4><p>Twenty-nine of the thirty people in the main study were women. The findings therefore rest almost entirely on a female group, even though pattern hair loss affects men too. Everyone in the study had mild-to-moderate hair loss and was between 33 and 55 years old.</p><p>The laboratory findings came from cells in a dish, not from patients.</p><p>The product was tested as a cosmetic, under the rules Korea applies to cosmetic products, not as a medicine.</p><h4 class="pv-h">The Question Worth Asking</h4><p>This is a topical product studied in a small, well-controlled trial with a mostly female group. If hair loss is something you are dealing with, the question for a physician is what the evidence actually supports for someone in your situation, and what it does not.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'alopecia-email': {
    title: 'Email templates',
    kind: 'Alopecia',
    html: `<h4 class="pv-h">Email 1: What the research actually looked at</h4><p><b>Subject:</b> A hair loss study worth understanding properly</p><p>Hair loss research gets summarised badly, so here is one study described accurately.</p><p>In 2020, researchers published a double-blind, placebo-controlled trial of a topical scalp lotion. The active ingredient was conditioned medium from umbilical cord blood-derived stem cells: not the cells, but the fluid they release in culture. Thirty people completed 16 weeks, sixteen on the real product and fourteen on placebo.</p><p>Nothing was injected. It was a lotion, applied twice daily.</p><p>Over the next few emails we will walk through what it measured, what it found, and where the limits are.</p><h4 class="pv-h">Email 2: What it measured</h4><p><b>Subject:</b> Three numbers from a hair loss trial</p><p>Hair density in the treated group rose from about 97 to 110 hairs per square centimetre, an increase of 14.24 percent. In the placebo group it fell.</p><p>Hair growth rate rose from 0.262 to 0.312 mm per day, an increase of 19.54 percent. In the placebo group it fell.</p><p>Hair thickness rose 28.19 percent within the treated group. This one needs a caveat, and we will give it the next email rather than bury it here.</p><h4 class="pv-h">Email 3: The caveat on the thickness number</h4><p><b>Subject:</b> Why we are not leading with 28 percent</p><p>The 28.19 percent thickness increase is real, but it is a within-group change: the treated group compared against its own starting point.</p><p>When the researchers compared the treated group against the placebo group, the thickness difference was not statistically significant across the study period. It reached significance only at the 16-week timepoint.</p><p>Density and growth rate did hold up against placebo. Thickness is the weaker of the three, and any summary presenting all three as equivalent improvements over placebo is overstating what the paper says.</p><h4 class="pv-h">Email 4: Who was studied</h4><p><b>Subject:</b> The part most summaries leave out</p><p>Twenty-nine of the thirty participants were women. One was a man.</p><p>Pattern hair loss affects both sexes, but this trial's evidence rests almost entirely on a female population. Mean age was 46.9, range 33 to 55. Everyone had mild-to-moderate hair loss.</p><p>A separate 24-week trial of 43 completers found increased density as well, which strengthens the density finding.</p><p>The product was tested as a cosmetic formulation under Korean regulatory guidelines, not as a drug. No severe adverse effects, irritation or itching were reported.</p><p>If hair loss is something you are thinking about, the useful conversation with a physician is about what this evidence supports for someone in your situation, and what it does not.</p><p><i>These emails describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'alopecia-news': {
    title: 'Newsletter write-up',
    kind: 'Alopecia',
    html: `<h4 class="pv-h">Headline</h4><p>A Topical, Not an Injection: What a Double-Blind Hair Loss Trial Actually Found</p><h4 class="pv-h">Body</h4><p>A 2020 study published in <i>Cells</i> tested a scalp lotion containing 5 percent conditioned medium from umbilical cord blood-derived mesenchymal stromal cells. The distinction matters: what was applied is the fluid those cells release in culture, not the cells themselves, and it was applied topically twice daily rather than injected.</p><p>Thirty people completed the 16-week double-blind, placebo-controlled arm, sixteen on the active product and fourteen on placebo. Hair density in the treated group rose 14.24 percent while the placebo group declined. Hair growth rate rose 19.54 percent while the placebo group declined. Both differences were statistically significant against placebo. Hair thickness rose 28.19 percent within the treated group, but between-group differences were not significant across the study period and reached significance only at week 16.</p><p>A separate double-blind trial of 52 patients, 43 completing, ran to 24 weeks and also reported a significant increase in hair density.</p><p>No severe adverse effects, irritation or itching were reported. The agent was tested as a cosmetic formulation under Korean MFDS guidelines rather than as a drug.</p><p>The main limitation is who was studied. Twenty-nine of the thirty participants in the primary arm were female, mean age 46.9, all with mild-to-moderate pattern hair loss. The findings do not extend cleanly to men, to younger or older patients, or to advanced hair loss.</p><p>Oh HA et al., <i>Cells</i> 2020;9(6):1344. DOI 10.3390/cells9061344. Open access.</p><p><i>This write-up describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'

  'alopecia-social': {
    title: 'Social media write-up',
    kind: 'Alopecia',
    html: `<h4 class="pv-h">Variant 1 (short-form, general)</h4><p>Thirty people. Sixteen weeks. A double-blind, placebo-controlled trial of a scalp lotion made from what umbilical cord blood stem cells secrete, not the cells themselves. Hair density rose about 14 percent in the treated group and fell in the placebo group. Twenty-nine of the thirty participants were women. Worth asking your doctor whether research like this applies to you.</p><h4 class="pv-h">Variant 2 (question-led)</h4><p>Most people hear "stem cells for hair loss" and picture an injection. One 2020 double-blind trial tested a twice-daily lotion instead, made from the fluid those cells release in culture. Density and growth rate both improved against placebo over 16 weeks. Link in bio for the plain-language breakdown.</p><h4 class="pv-h">Variant 3 (stat-led)</h4><p>14.24 percent. That is how much hair density rose in the treated group of a double-blind, placebo-controlled trial of a topical cord blood-derived conditioned medium, over 16 weeks, while the placebo group declined. A separate 24-week cohort of 43 people found increased density too. Small studies, mostly female participants, tested as a cosmetic rather than a drug. Worth a conversation with a physician.</p><p><i>These posts describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,
