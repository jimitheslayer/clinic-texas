  't2d-prof': {
    title: 'Professional summary',
    kind: 'Type 2 Diabetes',
    html: `<h4 class="pv-h">Source</h4><p>Zang L, Li Y, Hao H, Liu J, Cheng Y, Li B, et al. "Efficacy and safety of umbilical cord-derived mesenchymal stem cells in Chinese adults with type 2 diabetes: a single-center, double-blinded, randomized, placebo-controlled phase II trial." <i>Stem Cell Research &amp; Therapy.</i> 2022;13:180. DOI 10.1186/s13287-022-02848-6. ClinicalTrials.gov NCT02302599. Open access (CC BY).</p><h4 class="pv-h">Study Design</h4><p>Single-center, double-blinded, randomized, placebo-controlled phase II trial at the First Medical Center of Chinese PLA General Hospital, October 2015 to December 2018. Ninety-one patients randomized, 45 to UC-MSCs and 46 to placebo; 73 completed. Three intravenous infusions at four-week intervals, 1&times;10&#8310; cells per kg per infusion, followed for 48 weeks. Placebo was the same volume and appearance: saline with 3% human albumin and multivitamins.</p><p>Inclusion required age 20 to 65, T2DM under 20 years' duration, HbA1c between 7.0% and 12.0%, inadequate control on stable insulin plus metformin for at least three months, fasting C-peptide at least 1 ng/mL, and BMI 24 to 40. Investigators and participants were masked to allocation.</p><h4 class="pv-h">Key Findings</h4><p>Primary endpoint, HbA1c below 7.0% with daily insulin reduced by at least 50% at 48 weeks: 20% of the treated group against 4.55% of placebo (p=0.0268, 95% CI for the rate difference 2.25 to 28.66%).</p><p>HbA1c fell 1.31% in the treated group (9.02 to 7.52%) against 0.63% in placebo (8.89 to 8.19%), p=0.0081 between groups. Insulin reduction was 27.78% against 15.62% at 48 weeks. Five of 37 treated patients (13.5%) became insulin-free between 8 and 24 weeks and remained so for a mean of 37.2 weeks; no placebo patient did.</p><p>Insulin resistance, measured by glucose infusion rate on hyperinsulinemic-euglycemic clamp, rose from 3.12 to 4.76 mg/min/kg in the treated group and 3.26 to 3.60 in placebo (p&lt;0.01 between groups at 48 weeks).</p><h4 class="pv-h">Negative Finding</h4><p>No improvement in islet beta-cell function in either group. Fasting C-peptide did not change significantly, and glucagon-stimulated C-peptide rose at 9 weeks then returned toward baseline. The authors attribute the effect to improved insulin sensitivity rather than beta-cell recovery, and note the reversal effect of UC-MSCs on beta-cell dedifferentiation is more robust at early stages of disease.</p><h4 class="pv-h">Safety</h4><p>No major transplantation-related adverse events. Two treated patients withdrew, one with cerebral infarction against a ten-year history of hypertension and hyperlipidemia, one with an accidental femoral neck fracture; an independent adjudication committee judged neither related to treatment. No cell-related immunological reactions or tumor formation. All 91 patients remain under follow-up for late-onset effects.</p><h4 class="pv-h">Cell Source</h4><p>Umbilical cord tissue. The methods describe isolation from the gelatinous tissue surrounding the vein and artery, which is Wharton's jelly. Cells were used at four passages and characterised as CD90, CD73 and CD105 positive, CD34, CD45 and HLA-DR negative. Not cord blood.</p><h4 class="pv-h">Limitations</h4><p>Single-center trial in a Chinese cohort. The authors state the results cannot be extended to all patients with T2DM given heterogeneity in age, disease course, beta-cell function and insulin resistance among enrollees. Follow-up was 48 weeks; longer observation is needed. Insulin reduction and insulin-free proportions were lower than in some earlier uncontrolled reports.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  't2d-lay': {
    title: 'Layperson summary',
    kind: 'Type 2 Diabetes',
    html: `<h4 class="pv-h">What This Study Tested</h4><p>Researchers tested whether cells taken from donated umbilical cord tissue could help adults with type 2 diabetes whose blood sugar was not well controlled despite insulin and metformin.</p><p>Ninety-one people took part. Half received three infusions of the cells four weeks apart; half received a saline solution that looked identical. Neither the patients nor the doctors knew who received which until the study ended. Everyone was followed for 48 weeks.</p><h4 class="pv-h">What They Found</h4><p>The main goal was to get HbA1c, a long-term blood sugar measure, below 7% while cutting daily insulin in half. Twenty percent of the treated group reached that against about 4.5% of the comparison group.</p><p>Average HbA1c fell 1.31% in the treated group and 0.63% in the comparison group. Five of the treated patients stopped needing insulin altogether, starting between two and six months in, and stayed off it for around nine months. Nobody in the comparison group did.</p><p>The body's response to insulin also improved measurably in the treated group and not in the comparison group.</p><h4 class="pv-h">What Did Not Improve</h4><p>The pancreas's own insulin-producing capacity did not improve in either group. The researchers say the benefit came from the body using insulin better, not from the pancreas recovering. That distinction matters, and the paper states it plainly.</p><h4 class="pv-h">Safety</h4><p>No major side effects related to the treatment. Two treated patients left the study, one after a stroke in someone with a long history of high blood pressure and cholesterol, and one after breaking a hip in an accident. An independent committee found neither was caused by the treatment.</p><h4 class="pv-h">What This Doesn't Mean</h4><p>This was one hospital in China, with 91 patients, followed for a little under a year. The researchers say directly that the results cannot be assumed to apply to everyone with type 2 diabetes. The cells came from cord tissue, not cord blood, and those are different starting materials.</p><h4 class="pv-h">The Question Worth Asking</h4><p>This is a properly controlled trial with a real comparison group, which is uncommon in this field. If type 2 diabetes affects you or someone close to you, the useful question for a physician is what a study like this does and does not support.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  't2d-email': {
    title: 'Email templates',
    kind: 'Type 2 Diabetes',
    html: `<h4 class="pv-h">Email 1: A trial with a real comparison group</h4><p><b>Subject:</b> 91 patients, double-blinded, 48 weeks</p><p>Most stem cell studies you read about have no comparison group. This one does.</p><p>A 2022 phase II trial randomized 91 adults with poorly controlled type 2 diabetes to either three infusions of umbilical cord-derived cells or an identical-looking placebo. Neither the patients nor the investigators knew who got which. Everyone was followed for 48 weeks.</p><p>Over the next few emails we will go through what it measured, what moved, and what did not.</p><h4 class="pv-h">Email 2: What moved</h4><p><b>Subject:</b> 20 percent versus 4.5 percent</p><p>The goal was HbA1c under 7% with daily insulin cut by at least half. Twenty percent of the treated group got there against 4.55% of placebo.</p><p>HbA1c fell 1.31% against 0.63%. Five of 37 treated patients came off insulin entirely and stayed off it for roughly nine months. None in the placebo group did.</p><h4 class="pv-h">Email 3: What did not move</h4><p><b>Subject:</b> The finding they did not bury</p><p>Islet beta-cell function did not improve. In either group.</p><p>The authors say so in the abstract. Their reading is that the benefit came from improved insulin sensitivity rather than from pancreatic recovery, and the clamp data supports that: glucose infusion rate rose in the treated group and stayed flat in placebo.</p><p>A study that reports its own null result is easier to trust on the results that did move.</p><h4 class="pv-h">Email 4: The cell source, and why it matters</h4><p><b>Subject:</b> Cord tissue is not cord blood</p><p>The methods describe cells isolated from the gelatinous tissue surrounding the cord's vein and artery. That is Wharton's jelly, cord tissue. Not cord blood.</p><p>Those are different starting materials with different cell populations, and results from one do not transfer to the other. Any summary that says only "umbilical cord-derived" is leaving out something a physician would want to know.</p><p>Single center, Chinese cohort, 48 weeks. The authors state the results cannot be extended to all patients with type 2 diabetes. Worth a conversation with a physician about what it does and does not support.</p><p><i>These emails describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  't2d-news': {
    title: 'Newsletter write-up',
    kind: 'Type 2 Diabetes',
    html: `<h4 class="pv-h">Headline</h4><p>Double-Blinded and Placebo-Controlled: What a 91-Patient Diabetes Trial Found, and What It Didn't</p><h4 class="pv-h">Body</h4><p>A 2022 phase II trial published in <i>Stem Cell Research &amp; Therapy</i> randomized 91 Chinese adults with inadequately controlled type 2 diabetes to three intravenous infusions of umbilical cord tissue-derived mesenchymal stem cells or to an identical-appearing placebo, four weeks apart, with 48 weeks of follow-up. Investigators and participants were both masked.</p><p>At 48 weeks, 20% of the treated group reached the primary endpoint of HbA1c below 7.0% with daily insulin reduced by at least half, against 4.55% of placebo. HbA1c fell 1.31% against 0.63%. Five of 37 treated patients became insulin-free and remained so for a mean of 37 weeks; none did in the placebo group. Insulin resistance measured by hyperinsulinemic-euglycemic clamp improved significantly in the treated group only.</p><p>Islet beta-cell function did not improve in either group. The authors report this directly and attribute the observed benefit to improved insulin sensitivity rather than pancreatic recovery.</p><p>No major treatment-related adverse events occurred. Two withdrawals in the treated group were adjudicated as unrelated to treatment.</p><p>The cells were isolated from Wharton's jelly, the tissue surrounding the cord's vessels, which is cord tissue rather than cord blood. Limitations are single-center design, a Chinese cohort, and 48 weeks of follow-up; the authors state the findings cannot be extended to all patients with type 2 diabetes.</p><p>Zang L et al., <i>Stem Cell Res Ther</i> 2022;13:180. DOI 10.1186/s13287-022-02848-6. NCT02302599. Open access.</p><p><i>This write-up describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  't2d-social': {
    title: 'Social media write-up',
    kind: 'Type 2 Diabetes',
    html: `<h4 class="pv-h">Variant 1 (short-form, general)</h4><p>Ninety-one patients. Double-blinded. Placebo-controlled. A 2022 trial of umbilical cord tissue-derived cells in type 2 diabetes found 20 percent of the treated group reached the target of HbA1c under 7 with insulin cut in half, against 4.5 percent on placebo. Single centre, 48 weeks. Worth asking your doctor whether research like this is relevant to you.</p><h4 class="pv-h">Variant 2 (question-led)</h4><p>What happens when a stem cell trial has a real placebo group and nobody knows who got what? A 2022 phase II study in type 2 diabetes ran exactly that design. Five patients came off insulin entirely. Beta-cell function did not improve. Both findings are in the paper. Link in bio.</p><h4 class="pv-h">Variant 3 (stat-led)</h4><p>HbA1c down 1.31 percent against 0.63 percent on placebo. Five of 37 patients insulin-free. Beta-cell function unchanged in both groups. That last one is the researchers' own finding, reported in their abstract, and it is why the rest reads as credible. 2022, phase II, n=91. Worth a conversation with a physician.</p><p><i>These posts describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'

  'uc-prof': {
    title: 'Professional summary',
    kind: 'Ulcerative Colitis',
    html: `<h4 class="pv-h">Source</h4><p>Jiang X, Luo X, Cai C, Bai Y, Ding H, Yue H, et al. "Umbilical cord mesenchymal stem cells in ulcerative colitis treatment: efficacy and possible mechanisms." <i>Stem Cell Research &amp; Therapy.</i> 2024;15:272. DOI 10.1186/s13287-024-03878-y. Chinese Clinical Trial Registry ChiCTR1900026035. Open access (CC BY-NC-ND).</p><h4 class="pv-h">Study Design</h4><p>Prospective, self-controlled before-and-after clinical study at Henan Provincial People's Hospital, enrolling continuously from September 2018 to March 2023. Forty-one patients with moderate-to-severe active ulcerative colitis unresponsive to conventional therapy received intravenous UMSCs monthly for two months at 1&times;10&#8310; cells per kg. Primary outcome was clinical response at two months.</p><p>Patients aged 18 to 65 with Mayo score 6 to 12 who had failed 5-ASA or glucocorticoids. Twenty-two of 41 were classed refractory: steroid-dependent, steroid-resistant, immunosuppressant-resistant, or non-responsive to biologics. Assessment used Mayo score, Mayo endoscopic score, UCEIS and the Nancy histological index, with colonoscopy at 0, 2 and 6 months.</p><h4 class="pv-h">Key Findings</h4><p>At two months, 73.2% (30/41) achieved clinical response, 41.5% (17/41) clinical remission, and 43.9% (18/41) mucosal healing. At six months, with two lost to follow-up, the figures were 61.0%, 34.2% and 41.5%; glucocorticoid-free remission reached 30.0% (3/10). Sustained response at both timepoints was 58.5%, sustained remission 26.8%.</p><p>Mayo score fell from 10.6 to 4.9 at two months and 5.1 at six. UCEIS average fell 2.7 to 1.8 to 1.6, Nancy index 4.0 to 2.0, all p&lt;0.001. Albumin and hemoglobin rose significantly.</p><p>Of 30 two-month responders, 14 had no recurrence during follow-up, 13 maintained over one year and six over three years, after two infusions with no maintenance therapy. Roughly half the two-month responders relapsed by later follow-up.</p><h4 class="pv-h">Mechanism and Predictor</h4><p>Plasma IL-1&beta;, IL-6, IL-8, IL-12 and IL-17A fell after treatment with a rise in the IL-10/IL-17A ratio, more pronounced in responders. Plasma progerin, a marker of premature cellular senescence, was elevated at baseline against healthy controls and declined after treatment.</p><p>Age emerged as an independent predictor of efficacy on multivariate logistic regression, odds ratio 0.875 (95% CI 0.787 to 0.972), ROC AUC 0.791, with a cut-off around 54 years at 70% sensitivity and 81.82% specificity.</p><h4 class="pv-h">Safety</h4><p>Most common events were low fever (9.8%) and fatigue (12.2%), resolving with symptomatic treatment. No serious adverse events, infections or cancers during treatment or follow-up.</p><h4 class="pv-h">Cell Source</h4><p>Umbilical cord-derived mesenchymal stem cells from full-term healthy donors, cultured in serum-free medium and characterised by surface antigen panel. The paper does not specify which cord compartment the cells were isolated from.</p><h4 class="pv-h">Limitations</h4><p>The authors state these plainly: single-center, non-randomized, single-arm, with no control group. Response and remission rates are compared against published infliximab and vedolizumab figures from other studies, which is not a head-to-head comparison. Each patient received only two infusions with no maintenance, and approximately 50% of two-month responders relapsed subsequently. The trial was registered retrospectively.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

    title: 'Layperson summary',
    kind: 'Ulcerative Colitis',
    html: `<h4 class="pv-h">What This Study Tested</h4><p>Forty-one people with moderate-to-severe ulcerative colitis, all of whom had already failed standard medications, received two infusions of cells taken from donated umbilical cord, one month apart. They were then followed for six months and longer.</p><p>Everyone in the study received the treatment. There was no comparison group, which the researchers state clearly as a limitation.</p><h4 class="pv-h">What They Found</h4><p>At two months, about 73 percent had a clinical response and about 42 percent were in remission. Roughly 44 percent showed healing of the intestinal lining on endoscopy.</p><p>At six months the numbers were 61 percent responding and 34 percent in remission. Three of the ten patients who had been on steroids were able to come off them entirely.</p><p>Of the 30 patients who responded at two months, 14 had no recurrence at all during follow-up. Thirteen went more than a year and six went more than three years, after just two infusions and no ongoing treatment. About half the responders did relapse later.</p><h4 class="pv-h">Something the Researchers Could Predict</h4><p>Age turned out to predict who responded. Patients around 54 or younger were considerably more likely to benefit. The researchers found this by analysing the data rather than by assuming it, and they report the statistical strength of the finding.</p><p>They also measured markers of inflammation and of cellular aging in the blood, and both dropped after treatment, more so in the patients who responded.</p><h4 class="pv-h">Safety</h4><p>The most common effects were mild fever and fatigue, which passed with rest and simple treatment. No serious adverse events, infections or cancers occurred during the study or the follow-up.</p><h4 class="pv-h">What This Doesn't Mean</h4><p>There was no comparison group, so it is not possible to say how these patients would have done without the treatment. It was one hospital, 41 patients. The researchers compare their numbers to published figures for two standard drugs, but that is not a direct comparison and they say so.</p><h4 class="pv-h">The Question Worth Asking</h4><p>Two infusions, no maintenance, and some patients going years without recurrence is an unusual pattern worth understanding properly. If ulcerative colitis affects you, the useful conversation with a physician is about what an uncontrolled study can and cannot establish.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'uc-email': {
    title: 'Email templates',
    kind: 'Ulcerative Colitis',
    html: `<h4 class="pv-h">Email 1: Two infusions, then nothing</h4><p><b>Subject:</b> Six patients, three years, no recurrence</p><p>A 2024 study followed 41 people with moderate-to-severe ulcerative colitis who had already failed conventional treatment. They received two infusions of umbilical cord-derived cells, one month apart, and then no maintenance therapy at all.</p><p>Fourteen of the thirty who responded had no recurrence during follow-up. Six went past three years.</p><p>Over the next few emails we will look at the numbers, the limitation that shapes all of them, and the one thing the researchers found they could predict.</p><h4 class="pv-h">Email 2: The numbers</h4><p><b>Subject:</b> 73 percent at two months, 61 at six</p><p>Clinical response was 73.2% at two months and 61.0% at six. Remission was 41.5% then 34.2%. Mucosal healing on endoscopy was 43.9% then 41.5%.</p><p>Three of ten patients on steroids achieved glucocorticoid-free remission. Mayo score fell from 10.6 to around 5 and held there.</p><h4 class="pv-h">Email 3: The limitation that shapes everything above</h4><p><b>Subject:</b> There was no control group</p><p>Every patient in this study received the treatment. There was no placebo arm and no randomization, and the authors list this first among their own limitations.</p><p>That means the response rates cannot be compared cleanly against doing nothing. The paper does compare them to published infliximab and vedolizumab figures, but those come from different studies with different patients, and the authors say so rather than implying otherwise.</p><p>About half the two-month responders relapsed later, which is also in the paper.</p><h4 class="pv-h">Email 4: The thing they could predict</h4><p><b>Subject:</b> Age predicted who responded</p><p>Running the data against age, sex, BMI, disease duration, severity and prior treatment, only age came out as an independent predictor. Patients around 54 and younger were considerably more likely to respond, at odds ratio 0.875.</p><p>The researchers also tracked a blood marker of cellular aging called progerin. It was elevated in these patients against healthy controls and fell after treatment.</p><p>A study that identifies who it works for is more useful than one that reports an average. Worth a conversation with a physician about what that means for a particular situation.</p><p><i>These emails describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,

  'uc-news': {
    title: 'Newsletter write-up',
    kind: 'Ulcerative Colitis',
    html: `<h4 class="pv-h">Headline</h4><p>Two Infusions, No Maintenance: A 41-Patient Ulcerative Colitis Study, and the Limitation That Frames It</p><h4 class="pv-h">Body</h4><p>A 2024 prospective study published in <i>Stem Cell Research &amp; Therapy</i> treated 41 patients with moderate-to-severe active ulcerative colitis, all unresponsive to conventional therapy, with two monthly intravenous infusions of umbilical cord-derived mesenchymal stem cells at 1&times;10&#8310; cells per kg.</p><p>Clinical response was 73.2% at two months and 61.0% at six. Remission was 41.5% then 34.2%, with mucosal healing at 43.9% and 41.5%. Mayo score, UCEIS and the Nancy histological index all fell significantly, and albumin and hemoglobin rose. Of the 30 two-month responders, 14 had no recurrence during follow-up, 13 exceeding one year and six exceeding three years, after two infusions with no maintenance therapy. Roughly half the responders relapsed subsequently.</p><p>Age emerged as an independent predictor of response on multivariate analysis, odds ratio 0.875, with a cut-off near 54 years. Plasma inflammatory cytokines and progerin, a marker of premature cellular senescence, both declined after treatment, more markedly in responders.</p><p>The most common adverse effects were low fever and fatigue. No serious adverse events, infections or cancers were reported.</p><p>The study was single-center, non-randomized and single-arm with no control group, which the authors state first among their limitations. Comparisons drawn against published infliximab and vedolizumab response rates are not head-to-head. Registration with the Chinese Clinical Trial Registry was retrospective.</p><p>Jiang X et al., <i>Stem Cell Res Ther</i> 2024;15:272. DOI 10.1186/s13287-024-03878-y. ChiCTR1900026035. Open access.</p><p><i>This write-up describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'

    html: `<h4 class="pv-h">Variant 1 (short-form, general)</h4><p>Two infusions. No maintenance therapy. Six patients went more than three years without recurrence. A 2024 study of umbilical cord-derived cells in 41 people with treatment-resistant ulcerative colitis. Single-arm, no control group, and the researchers say so. Worth asking your doctor about.</p><h4 class="pv-h">Variant 2 (question-led)</h4><p>What predicts whether a treatment works? In a 2024 ulcerative colitis study, the answer turned out to be age. Patients around 54 and under responded considerably better, and the researchers found that by analysing their own data rather than assuming it. Link in bio.</p><h4 class="pv-h">Variant 3 (stat-led)</h4><p>73 percent response at two months. 61 percent at six. 41 patients, all of whom had already failed standard treatment. No control group, which is the study's own first-listed limitation. 2024, published open access. Worth a conversation with a physician about what an uncontrolled study can establish.</p><p><i>These posts describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,

  'cardiac-prof': {
    title: 'Professional summary',
    kind: 'Heart Failure & MI',
    html: `<h4 class="pv-h">Source</h4><p>Abouzid MR, Ali K, Kamel I, Esteghamati S, Saleh A, Ghanim M. "The Safety and Efficacy of Human Umbilical Cord-Derived Mesenchymal Stem Cells in Patients With Heart Failure and Myocardial Infarction: A Meta-Analysis of Clinical Trials." <i>Cureus.</i> 2023;15(11):e49645. DOI 10.7759/cureus.49645. Open access (CC BY 4.0).</p><h4 class="pv-h">What This Is</h4><p>A systematic review and meta-analysis, not a primary trial. PRISMA methodology, PubMed search to December 2022, pooling three randomized controlled trials totalling 201 patients. Cochrane risk-of-bias assessment applied. Primary outcome ejection fraction; secondary outcomes readmission and mortality.</p><h4 class="pv-h">The Three Pooled Trials</h4><p>Gao et al. 2015, double-blinded RCT, 112 patients with ST-elevation acute MI, intracoronary Wharton's jelly-derived MSCs, 12-month follow-up. Bartolucci et al. 2017, the RIMECARD trial, double-blinded RCT, 30 patients with congestive heart failure, intravenous UC-MSCs, reported at both 6 and 12 months. Zhao et al. 2015, double-blinded RCT, 59 patients with congestive heart failure, intracoronary UC-MSCs, 6-month follow-up.</p><h4 class="pv-h">Key Findings</h4><p>At 12 months, ejection fraction favoured the treated group: mean difference 3.21, 95% CI 2.91 to 3.51, p&lt;0.00001, with homogeneous pooled studies (I&sup2;=0%).</p><p>At 6 months there was no significant difference: mean difference 1.30, 95% CI -1.94 to 4.54, p=0.43, with substantial heterogeneity (I&sup2;=69%). The authors read this as indicating that follow-up duration shapes the response.</p><p>Readmission showed no significant difference, risk ratio 0.5, 95% CI 0.22 to 1.15, p=0.10. Mortality showed no significant difference, risk ratio 0.44, 95% CI 0.14 to 1.44, p=0.18.</p><h4 class="pv-h">The Authors' Own Caution</h4><p>The paper states directly that a statistically significant increase in LVEF does not necessarily correspond to clinical benefit, and devotes a section to the distinction, naming symptom alleviation, quality of life, functional outcomes, hospitalisation and long-term prognosis as the measures that would establish clinical relevance.</p><h4 class="pv-h">Risk of Bias</h4><p>Assessed by Cochrane tool. Bartolucci 2017 and Gao 2015 rated low risk across sequence generation, allocation concealment, blinding of participants and personnel, blinding of outcome assessment, and selective reporting. Zhao 2015 rated high risk on allocation concealment, blinding of participants and personnel, and blinding of outcome assessment.</p><h4 class="pv-h">Cell Source</h4><p>Umbilical cord-derived mesenchymal stromal cells. The paper notes these can be isolated from Wharton's jelly, the cord lining, or the perivascular region; Gao 2015 specifically used Wharton's jelly-derived cells.</p><h4 class="pv-h">Limitations</h4><p>Only three trials and 201 patients. Heterogeneous follow-up durations of 6 and 12 months. Fewer than ten pooled studies meant publication bias could not be assessed by Egger's test. Analysis focused on LVEF, readmission and mortality, omitting quality of life and symptom improvement. Longest follow-up was 12 months. The authors conclude that additional large-scale randomized double-blind studies are required.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'cardiac-lay': {
    title: 'Layperson summary',
    kind: 'Heart Failure & MI',
    html: `<h4 class="pv-h">What This Paper Is</h4><p>This is not a single study. It is an analysis that pools three separate randomized trials of umbilical cord-derived cells in patients with heart failure or after a heart attack, adding up to 201 patients in total.</p><p>All three trials were double-blinded, meaning neither the patients nor the doctors knew who received the cells and who received a placebo.</p><h4 class="pv-h">What They Found</h4><p>Ejection fraction, a measure of how well the heart pumps, improved in the treated group at 12 months. The improvement was consistent across the trials that reported at that timepoint.</p><p>At 6 months there was no measurable difference. The researchers read this as meaning the effect takes time to appear rather than that it is absent.</p><h4 class="pv-h">What Did Not Change</h4><p>Two things did not improve: the rate of readmission to hospital, and the death rate. Neither showed a statistically significant difference between the treated and placebo groups.</p><p>The authors also say something worth quoting in spirit: a statistically significant improvement in a heart measurement does not automatically mean a patient feels better or lives longer. They spend a full section of the paper on that distinction.</p><h4 class="pv-h">What This Doesn't Mean</h4><p>Three trials and 201 patients is a small evidence base. The longest anyone was followed was 12 months. One of the three trials was rated as having a high risk of bias in several respects. And the analysis did not look at quality of life or symptoms at all.</p><p>The authors conclude that larger randomized studies are needed before the efficacy of this approach can be considered established.</p><h4 class="pv-h">The Question Worth Asking</h4><p>A paper that reports one improvement and two non-improvements, and then cautions against over-reading the improvement, is telling you where the field actually stands. If heart failure affects you, that is the honest starting point for a conversation with a cardiologist.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'cardiac-email': {
    title: 'Email templates',
    kind: 'Heart Failure & MI',
    html: `<h4 class="pv-h">Email 1: Not one study, three</h4><p><b>Subject:</b> Three randomized trials, 201 patients, pooled</p><p>A 2023 meta-analysis gathered every randomized controlled trial of umbilical cord-derived cells in heart failure and myocardial infarction that met its criteria. Three qualified, totalling 201 patients. All three were double-blinded.</p><p>Pooling trials rather than reading one is how you find out where a field actually stands rather than what one group found.</p><h4 class="pv-h">Email 2: One endpoint moved</h4><p><b>Subject:</b> Ejection fraction at twelve months</p><p>Ejection fraction improved in the treated group at 12 months, mean difference 3.21, and the trials agreed with each other closely at that timepoint.</p><p>At 6 months there was no significant difference and the trials disagreed considerably. The authors read this as follow-up duration shaping the result.</p><h4 class="pv-h">Email 3: Two endpoints did not</h4><p><b>Subject:</b> Readmission and mortality: no difference</p><p>Hospital readmission showed no significant difference. Neither did mortality.</p><p>The authors then say something that matters more than either number: a statistically significant improvement in ejection fraction does not necessarily correspond to clinical benefit. They devote a section to what would have to be measured to establish that, including quality of life, exercise tolerance and long-term prognosis, and note their analysis did not cover those.</p><h4 class="pv-h">Email 4: How to read a small evidence base</h4><p><b>Subject:</b> Three trials is not many</p><p>Three trials, 201 patients, longest follow-up 12 months. One of the three carried a high risk of bias on blinding and allocation concealment by the authors' own Cochrane assessment. Publication bias could not be tested because there were too few studies.</p><p>The conclusion the authors reach is that larger randomized double-blind studies are required to establish safety and efficacy, and to show whether statistical significance translates into clinical benefit.</p><p>That is where the field is. Worth a conversation with a cardiologist about what it does and does not support.</p><p><i>These emails describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,

  'cardiac-news': {
    title: 'Newsletter write-up',
    kind: 'Heart Failure & MI',
    html: `<h4 class="pv-h">Headline</h4><p>Three Randomized Trials, 201 Patients: One Endpoint Moved and Two Did Not</p><h4 class="pv-h">Body</h4><p>A 2023 meta-analysis published in <i>Cureus</i> pooled three double-blinded randomized controlled trials of umbilical cord-derived mesenchymal stem cells in patients with heart failure and myocardial infarction, totalling 201 patients. The included trials were Gao 2015 (112 patients, ST-elevation acute MI, intracoronary Wharton's jelly-derived cells), Bartolucci 2017, the RIMECARD trial (30 patients, congestive heart failure, intravenous), and Zhao 2015 (59 patients, congestive heart failure, intracoronary).</p><p>At 12 months, ejection fraction favoured the treated group with a mean difference of 3.21 (95% CI 2.91 to 3.51, p&lt;0.00001), with no heterogeneity between the pooled studies. At 6 months there was no significant difference and substantial heterogeneity.</p><p>Hospital readmission showed no significant difference (RR 0.5, p=0.10). Neither did mortality (RR 0.44, p=0.18).</p><p>The authors state directly that a statistically significant increase in ejection fraction does not necessarily correspond to clinical benefit, and devote a section of the discussion to the outcomes that would establish it: symptom alleviation, quality of life, functional capacity, hospitalisation rates and long-term prognosis. Their own analysis covered none of those.</p><p>By the authors' Cochrane risk-of-bias assessment, two of the three trials rated low risk across most domains; the third rated high risk on allocation concealment and on blinding of participants, personnel and outcome assessment.</p><p>Limitations include the small number of pooled trials, heterogeneous follow-up durations, inability to assess publication bias with fewer than ten studies, and a maximum follow-up of 12 months. The authors conclude that larger randomized double-blind studies are required.</p><p>Abouzid MR et al., <i>Cureus</i> 2023;15(11):e49645. DOI 10.7759/cureus.49645. Open access.</p><p><i>This write-up describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,

  'cardiac-social': {
    title: 'Social media write-up',
    kind: 'Heart Failure & MI',
    html: `<h4 class="pv-h">Variant 1 (short-form, general)</h4><p>Three randomized trials. 201 patients. Pooled in a 2023 meta-analysis of umbilical cord-derived cells in heart failure and after heart attack. Ejection fraction improved at twelve months. Readmission and mortality did not change. All three findings are in the paper. Worth asking a cardiologist about.</p><h4 class="pv-h">Variant 2 (question-led)</h4><p>Does a better heart measurement mean a better outcome for the patient? The authors of a 2023 meta-analysis ask that question about their own result and answer it honestly: not necessarily. Link in bio for the plain-language version.</p><h4 class="pv-h">Variant 3 (stat-led)</h4><p>One endpoint moved. Two did not. Ejection fraction improved at twelve months across three pooled randomized trials of cord-derived cells in heart failure; hospital readmission and mortality showed no significant difference. Longest follow-up twelve months. The authors call for larger trials. That is where this field currently stands.</p><p><i>These posts describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,

  'crohns-prof': {
    title: 'Professional summary',
    kind: "Crohn's Disease",
    html: `<h4 class="pv-h">Source</h4><p>Zhang J, Lv S, Liu X, Song B, Shi L. "Umbilical Cord Mesenchymal Stem Cell Treatment for Crohn's Disease: A Randomized Controlled Clinical Trial." <i>Gut and Liver.</i> 2018;12(1):73-78. DOI 10.5009/gnl17035. ClinicalTrials.gov NCT02445547. Open access.</p><h4 class="pv-h">Study Design</h4><p>Prospective, randomized, controlled, <b>open-label</b> clinical trial at Shaanxi Provincial People's Hospital, conducted June 2012 to June 2015, IRB00006161. One hundred and eight patients screened, 82 enrolled, 41 randomized to each arm by computer-generated block randomization; 37 and 38 completed, with four and three dropouts respectively, all for non-adherence.</p><p>Inclusion required age over 18 and moderate-to-severe Crohn's disease with CDAI between 220 and 450, with all patients on steroid maintenance for more than six months before enrollment. Concomitant immunosuppressives were permitted at maintained dosage; anti-TNF therapy was excluded within three months prior. Existing treatment continued after infusion.</p><p>The treated arm received four peripheral intravenous infusions of 1&times;10&#8310; UC-MSCs per kg, one per week. Low-molecular-weight heparin 2,500 IU subcutaneously daily for three days was given as thrombosis prophylaxis. Follow-up at 3, 6, 9 and 12 months, with colonoscopy at 12 months.</p><p>The paper does not designate a primary endpoint. Its power calculation assumed a 30% decrease in steroid dose at one year from an average 12.5 mg/day, with 40 patients per group giving 90% power at alpha 0.05.</p><h4 class="pv-h">Key Findings</h4><p>At 12 months, decreases in the UC-MSC group against control: CDAI 62.5&plusmn;23.2 against 23.6&plusmn;12.4 (p&lt;0.01); Harvey-Bradshaw index 3.4&plusmn;1.2 against 1.2&plusmn;0.58 (p&lt;0.05); corticosteroid dose 4.2&plusmn;0.84 mg/day against 1.2&plusmn;0.35 mg/day (p&lt;0.05).</p><p>In absolute terms the treated group moved from CDAI 281.5&plusmn;75.2 to 219.0&plusmn;67.6, from HBI 12.7&plusmn;3.2 to 9.3&plusmn;2.9, and from 13.6&plusmn;2.8 mg/day steroid to 9.4&plusmn;3.1.</p><p>The endoscopic result is the strongest finding in the paper. CDEIS fell from 9.2&plusmn;1.5 to 3.4&plusmn;1.2 in the treated group against 8.7&plusmn;2.3 to 7.2&plusmn;1.9 in control (p&lt;0.01). Concomitant anal fistula improved in six treated patients and in none of the seven control patients who had it.</p><h4 class="pv-h">The Finding the Paper States Plainly</h4><p><b>"No patient achieved complete remission (CDAI&lt;150)."</b> The treated group moved from moderate-to-severe to still moderate-to-severe. Baseline characteristics were balanced across all measured variables, with every baseline p-value non-significant.</p><h4 class="pv-h">Safety</h4><p>Four patients developed fever after infusion, relieved with symptomatic treatment. Seven patients had nine episodes of upper respiratory tract infection within six months post-infusion; the incidence was higher in the treated group but not significantly so. No serious adverse events. No dyspnea after infusion. Coagulation panel and D-dimer negative for thrombosis. Blood count, liver and renal function unchanged at 12 months in both arms.</p><h4 class="pv-h">Cell Source</h4><p>Umbilical cord tissue. Methods describe a 5 cm cord segment from a full-term newborn, with mesenchymal tissue taken from Wharton's jelly, diced and centrifuged. The term cord blood appears nowhere in the paper.</p><h4 class="pv-h">Limitations, in the Authors' Own Words</h4><p>The paper has no dedicated limitations section; these appear in the Discussion. "The study was an open-label trial conducted at a single center; and it did not examine indicators of immune status or intestinal histopathology in patients. Therefore, the mechanism by which stem cell therapy affects CD remains unclear." "The long-term effect of UC-MSC therapy remains to be investigated." On delivery: "the disadvantages were little distribution of UC-MSCs in the intestinal tissue and a risk of cells being retained in the pulmonary capillaries."</p><p>Two further self-assessments are worth reading directly. "Most of the patients still used steroid at 12 months, which seemed not superior to the efficacy of TNF blocker." And: "it has to be admitted that the UC-MSC therapy has moderate immunomodulatory effects."</p><p>All efficacy p-values are reported as thresholds rather than exact values.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'crohns-lay': {
    title: 'Layperson summary',
    kind: "Crohn's Disease",
    html: `<h4 class="pv-h">What This Study Tested</h4><p>Eighty-two people with moderate-to-severe Crohn's disease, all of whom had been on steroids for more than six months, were split by chance into two groups of 41. One group received four weekly infusions of cells taken from donated umbilical cord tissue. The other continued their existing treatment. Everyone was followed for a year.</p><p>Both groups knew which they were in. That is called open-label, and it matters because knowing you are receiving a treatment can affect how you report symptoms.</p><h4 class="pv-h">What They Found</h4><p>Two standard disease-activity scores improved more in the treated group than in the control group, and so did steroid dose. Treated patients came down about 4.2 mg a day of steroid against about 1.2 mg in the control group.</p><p>The strongest result came from colonoscopy. A score for how inflamed the bowel looked fell from about 9.2 to 3.4 in the treated group, while barely moving in the control group. That is a measurement a camera takes, not a symptom a patient reports, which makes it harder to influence unconsciously.</p><p>Six treated patients with an anal fistula saw it improve. None of the seven control patients with one did.</p><h4 class="pv-h">What the Paper Says About Its Own Result</h4><p>Nobody went into remission. Not one patient in either group. The treated group's disease activity score went from moderate-to-severe down to still moderate-to-severe.</p><p>The authors also write that most patients were still on steroids at twelve months, and that this "seemed not superior to the efficacy of TNF blocker," meaning the existing biologic drugs. They describe the effect as moderate.</p><p>A paper willing to say that about its own findings is telling you something useful about where this treatment currently sits.</p><h4 class="pv-h">Safety</h4><p>Four patients had a fever after infusion, which settled with simple treatment. Seven had chest infections in the following six months, slightly more than the control group but not by a meaningful margin. No serious adverse events. No signs of clotting problems.</p><h4 class="pv-h">Where the Cells Came From</h4><p>Umbilical cord tissue, specifically Wharton's jelly, the gelatinous material inside the cord. Not cord blood. Those are different materials.</p><h4 class="pv-h">The Question Worth Asking</h4><p>The measurements moved, the bowel looked better on camera, and nobody reached remission. All three are true at once. If Crohn's disease affects you, that combination is the honest starting point for a conversation with a gastroenterologist.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,

  'crohns-email': {
    title: 'Email templates',
    kind: "Crohn's Disease",
    html: `<h4 class="pv-h">Email 1: A trial with a real control group</h4><p><b>Subject:</b> 82 patients, randomized, twelve months</p><p>A 2018 trial published in <i>Gut and Liver</i> randomized 82 patients with moderate-to-severe Crohn's disease into two groups of 41. One received four weekly infusions of umbilical cord-derived cells; the other continued existing treatment. Everyone was followed for a year.</p><p>It was open-label, meaning both groups knew which they were in. That is worth holding in mind as we go through the results.</p><h4 class="pv-h">Email 2: What moved</h4><p><b>Subject:</b> Disease activity, steroid dose, and a camera</p><p>Two disease-activity scores improved more in the treated group. CDAI fell 62.5 against 23.6 in control. The Harvey-Bradshaw index fell 3.4 against 1.2. Steroid dose came down 4.2 mg a day against 1.2 mg.</p><p>The strongest result was endoscopic. The CDEIS score, taken by colonoscopy, fell from 9.2 to 3.4 in the treated group and from 8.7 to only 7.2 in the control group.</p><p>That distinction matters. Symptom scores can be influenced by knowing you are being treated. A camera looking at the bowel lining is harder to influence.</p><h4 class="pv-h">Email 3: The sentence in the results</h4><p><b>Subject:</b> "No patient achieved complete remission"</p><p>That is a direct quote from the paper's Results section. Not one patient in either arm reached remission.</p><p>The treated group went from a CDAI of 281.5 to 219.0. Both of those numbers sit in the moderate-to-severe range. The improvement is real and measured; it did not cross the line that clinicians care most about.</p><h4 class="pv-h">Email 4: What the authors say about their own result</h4><p><b>Subject:</b> "Moderate immunomodulatory effects"</p><p>From the Discussion: "most of the patients still used steroid at 12 months, which seemed not superior to the efficacy of TNF blocker." And: "it has to be admitted that the UC-MSC therapy has moderate immunomodulatory effects."</p><p>They also note the trial was open-label and single-center, did not examine immune status or intestinal histopathology, and that the mechanism therefore remains unclear. And that long-term effect remains to be investigated.</p><p>A research team that grades its own work honestly is easier to trust on the parts that did work. The full paper is open access at DOI 10.5009/gnl17035, and it is worth a conversation with a gastroenterologist about what it does and does not support.</p><p><i>These emails describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,

  'crohns-news': {
    title: 'Newsletter write-up',
    kind: "Crohn's Disease",
    html: `<h4 class="pv-h">Headline</h4><p>Randomized, Open-Label, 82 Patients: Disease Activity Fell, Nobody Reached Remission</p><h4 class="pv-h">Body</h4><p>A 2018 randomized controlled trial published in <i>Gut and Liver</i> enrolled 82 patients with moderate-to-severe Crohn's disease, all on steroid maintenance for over six months, randomizing 41 to four weekly intravenous infusions of umbilical cord-derived mesenchymal stem cells at 1&times;10&#8310; cells per kg and 41 to continued standard care. Follow-up was 12 months with colonoscopy at the end. The trial was open-label and single-center, registered as NCT02445547.</p><p>At 12 months the treated group's CDAI fell 62.5&plusmn;23.2 against 23.6&plusmn;12.4 in control (p&lt;0.01), Harvey-Bradshaw index 3.4&plusmn;1.2 against 1.2&plusmn;0.58 (p&lt;0.05), and corticosteroid dose 4.2&plusmn;0.84 mg/day against 1.2&plusmn;0.35 (p&lt;0.05). The endoscopic index CDEIS fell from 9.2&plusmn;1.5 to 3.4&plusmn;1.2 in the treated group against 8.7&plusmn;2.3 to 7.2&plusmn;1.9 in control (p&lt;0.01), the largest separation in the paper. Concomitant anal fistula improved in six treated patients and in none of seven controls.</p><p>The paper states in its Results that no patient achieved complete remission, defined as CDAI below 150, in either arm. The treated group moved from a mean CDAI of 281.5 to 219.0, remaining in the moderate-to-severe range.</p><p>In the Discussion the authors write that most patients were still using steroids at 12 months, which "seemed not superior to the efficacy of TNF blocker," and that "it has to be admitted that the UC-MSC therapy has moderate immunomodulatory effects." They further note the open-label single-center design, the absence of immune-status and histopathology data leaving the mechanism unclear, and that long-term effect remains to be investigated.</p><p>Safety: four fevers post-infusion, nine upper respiratory infections across seven patients within six months, no serious adverse events and no evidence of thrombosis. Cells were isolated from Wharton's jelly; the term cord blood does not appear in the paper.</p><p>Zhang J, Lv S, Liu X, Song B, Shi L. <i>Gut Liver</i> 2018;12(1):73-78. DOI 10.5009/gnl17035. NCT02445547. Open access.</p><p><i>This write-up describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'crohns-social': {

    kind: "Crohn's Disease",
    html: `<h4 class="pv-h">Variant 1 (short-form, general)</h4><p>Eighty-two patients, randomized, twelve months. A 2018 trial of umbilical cord-derived cells in moderate-to-severe Crohn's disease found disease activity, steroid dose and endoscopic inflammation all improved more than control. It also reports that no patient in either group reached remission. Both findings are in the paper. Worth asking a gastroenterologist about.</p><h4 class="pv-h">Variant 2 (question-led)</h4><p>What does a camera see that a symptom score can't? In a 2018 open-label Crohn's trial, the endoscopic inflammation score fell from 9.2 to 3.4 in the treated group and barely moved in the control group. Endoscopy is harder to influence than self-reported symptoms. Link in bio.</p><h4 class="pv-h">Variant 3 (stat-led)</h4><p>"It has to be admitted that the UC-MSC therapy has moderate immunomodulatory effects." That is the authors' own sentence about their own 82-patient randomized trial in Crohn's disease, published open access in 2018. Disease activity and steroid dose both improved against control. Nobody reached remission. Worth a conversation with a physician.</p><p><i>These posts describe published research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,

  'fistula-prof': {
    title: 'Professional summary',
    kind: "Crohn's Perianal Fistula",
    html: `<h4 class="pv-h">Source</h4><p>Wei J, Zhang Y, et al. "Efficacy and safety of allogeneic umbilical cord-derived mesenchymal stem cells for the treatment of complex perianal fistula in Crohn's disease: a pilot study." <i>Stem Cell Research &amp; Therapy.</i> 2023;14:311. DOI 10.1186/s13287-023-03531-0. Open access.</p><h4 class="pv-h">Study Design</h4><p>A pilot clinical study evaluating allogeneic umbilical cord-derived mesenchymal stem cells for the treatment of complex perianal fistula in patients with Crohn's disease.</p><h4 class="pv-h">Key Findings</h4><p>Sixty percent combined remission was reported at 24 weeks.</p><h4 class="pv-h">Clinical Context</h4><p>Complex perianal fistula is among the harder complications of Crohn's disease to treat, and it is the indication where cell therapy has the most established clinical footing. Adipose-derived products have been through phase III trials for this specific complication. This study asks whether an umbilical cord-derived allogeneic product performs in the same territory, which is a different question from the adipose-derived work and should not be conflated with it.</p><h4 class="pv-h">Cell Source</h4><p>Allogeneic umbilical cord-derived mesenchymal stem cells. Allogeneic means donor-derived rather than taken from the patient, which is inherent to cord-derived material.</p><h4 class="pv-h">Limitations</h4><p>This is a pilot study, an early-stage result that would benefit from confirmation in larger controlled trials. Specific numeric detail beyond the 24-week combined remission figure has not been independently extracted from the full paper for this library; the full text is open access at the DOI above.</p><h4 class="pv-h">Authors' Conclusion</h4><p>A pilot study reporting 60 percent combined remission at 24 weeks in complex perianal fistula associated with Crohn's disease.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,

    html: `<h4 class="pv-h">What This Study Tested</h4><p>Complex perianal fistula is one of the more difficult complications of Crohn's disease. This 2023 pilot study tested donor-derived cells from umbilical cord tissue as a treatment for it.</p><h4 class="pv-h">What They Found</h4><p>Sixty percent of patients reached combined remission at 24 weeks.</p><h4 class="pv-h">Why This Complication Specifically</h4><p>Of all the places cell therapy has been tried in Crohn's disease, perianal fistula has the most developed clinical record. Products made from fat-derived cells have been through large late-stage trials for this exact complication. This study is asking whether cord-derived cells work in the same space, which is a separate question with separate evidence behind it.</p><h4 class="pv-h">What This Doesn't Mean</h4><p>This is a pilot study. Pilot studies are designed to see whether something is worth investigating further, not to establish that it works. The result would need confirmation in larger controlled trials before broader conclusions could be drawn.</p><h4 class="pv-h">The Question Worth Asking</h4><p>If perianal fistula is part of your Crohn's disease, this is an area where cell therapy has more clinical history than most, and a gastroenterologist or colorectal surgeon will know that history. That makes it a good conversation to have with a specialist.</p><p><i>This summary describes published research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,

  'alopecia-yan-prof': {
    title: 'Professional summary',
    kind: 'Alopecia (Preclinical)',
    html: `<h4 class="pv-h">Source</h4><p>Yan W, Liu J, Xie X, et al. "Restoration of follicular beta-catenin signaling by mesenchymal stem cells promotes hair growth in mice with androgenetic alopecia." <i>Stem Cell Research &amp; Therapy.</i> 2024;15:439. DOI 10.1186/s13287-024-04051-1. PMID 39563459. PMC11575167. Open access.</p><h4 class="pv-h">Study Type</h4><p><b>This is preclinical research. Mouse model and in vitro work. No human patients were treated or studied.</b></p><h4 class="pv-h">Study Design</h4><p>Preclinical study combining intradermal transplantation of human umbilical cord mesenchymal stem cells into an androgenetic alopecia mouse model with a transwell co-culture experiment using dermal papilla cells, studied in culture rather than in patients.</p><h4 class="pv-h">Key Findings</h4><p>In the mouse model, transplantation was associated with restored follicular beta-catenin signaling and with hair growth in the treated animals.</p><p>In the separate co-culture work, the same signaling mechanism was supported in vitro.</p><h4 class="pv-h">Cell Source</h4><p>Human umbilical cord mesenchymal stem cells. Cord tissue, not cord blood. Whole cells, transplanted intradermally rather than administered as a secretome or vesicle preparation.</p><h4 class="pv-h">Limitations</h4><p>This is animal and laboratory data only. No human patients with androgenetic alopecia were treated or studied in this paper. Findings in a mouse model do not establish that the same effect occurs, or is safe, in humans.</p><h4 class="pv-h">Authors' Conclusion</h4><p>The paper reports a preclinical mechanistic finding: umbilical cord mesenchymal stem cells restoring follicular beta-catenin signaling in a mouse model of androgenetic alopecia, supported by in vitro co-culture work. This is not a clinical or patient outcome.</p><p><i>This summary describes published preclinical research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'

  'alopecia-yan-lay': {
    title: 'Layperson summary',
    kind: 'Alopecia (Preclinical)',
    html: `<h4 class="pv-h">What Kind of Study This Is</h4><p><b>This is early laboratory research. It was done in mice and in cells in a dish. No people were treated or studied.</b></p><h4 class="pv-h">What They Tested</h4><p>Researchers transplanted cells from human umbilical cord tissue into mice bred to have a form of pattern hair loss. Separately, they grew the cells alongside dermal papilla cells, which are the cells that help control the hair growth cycle, in a laboratory dish.</p><h4 class="pv-h">What They Found</h4><p>In the mice, the transplanted cells were linked to hair growth and to the restoration of a biological signal called beta-catenin, which is part of how hair follicles normally cycle between growing and resting.</p><p>The laboratory dish experiment supported the same mechanism.</p><h4 class="pv-h">What This Doesn't Mean</h4><p>This is animal and laboratory data only. No human patients with pattern hair loss were treated or studied in this paper.</p><p>Findings in a mouse model do not establish that the same thing happens in people, or that it would be safe in people. Many results that work in mice do not translate.</p><h4 class="pv-h">Why It's Still Worth Knowing</h4><p>Preclinical work is where the pipeline starts. Knowing what mechanism researchers are pursuing, and in what model, tells you where a field is heading long before there are human results to read.</p><p><i>This summary describes published preclinical research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'
  },

  'alopecia-yan-email': {
    title: 'Email templates',
    kind: 'Alopecia (Preclinical)',
    html: `<h4 class="pv-h">Email 1: What this is, before anything else</h4><p><b>Subject:</b> A mouse study on hair growth, labelled as one</p><p>This is preclinical research. Mice and cells in a dish. No human patients.</p><p>We are sending it because knowing what is in the pipeline is useful, and because most coverage of research like this does not say clearly what kind of study it was.</p><p>A 2024 study transplanted human umbilical cord mesenchymal stem cells into mice with a form of androgenetic alopecia.</p><h4 class="pv-h">Email 2: The mechanism</h4><p><b>Subject:</b> One signaling pathway, restored</p><p>The finding was that transplantation restored follicular beta-catenin signaling and was associated with hair growth in the treated animals.</p><p>Beta-catenin is part of how hair follicles cycle between growth and rest. A companion experiment growing the cells alongside dermal papilla cells in culture supported the same mechanism.</p><h4 class="pv-h">Email 3: What a mouse result is and is not</h4><p><b>Subject:</b> Why we are not calling this a treatment</p><p>Results in a mouse model do not establish that the same effect occurs in humans, or that it would be safe in humans. A great many findings that work in mice do not translate.</p><p>What preclinical work does tell you is where researchers are looking and what mechanism they think matters. That is worth following for its own sake.</p><p>The full paper is open access at DOI 10.1186/s13287-024-04051-1.</p><p><i>These emails describe published preclinical research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,

  'alopecia-yan-news': {
    title: 'Newsletter write-up',
    kind: 'Alopecia (Preclinical)',
    html: `<h4 class="pv-h">Headline</h4><p>Preclinical Update: Restoring Follicular Beta-Catenin Signaling With Cord Stem Cells (Mouse Model)</p><h4 class="pv-h">Body</h4><p>A 2024 study transplanted human umbilical cord mesenchymal stem cells into a mouse model of androgenetic alopecia, finding restored follicular beta-catenin signaling and hair growth in the treated animals. A companion co-culture experiment using dermal papilla cells supported the same mechanism.</p><p>This is animal and laboratory evidence only. No human patients were treated or studied. Findings in a mouse model do not establish that the same effect occurs, or is safe, in humans.</p><p>The cells were umbilical cord tissue-derived and administered as whole cells by intradermal transplantation, not as a secretome or vesicle preparation.</p><p>Yan W, Liu J, Xie X, et al. <i>Stem Cell Res Ther</i> 2024;15:439. DOI 10.1186/s13287-024-04051-1. Open access.</p><p><i>This write-up describes published preclinical research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,

  'alopecia-yan-social': {
    title: 'Social media write-up',
    kind: 'Alopecia (Preclinical)',
    html: `<h4 class="pv-h">Variant 1 (short-form, general)</h4><p>A 2024 mouse-model study found that transplanting umbilical cord stem cells restored a key hair-growth signaling pathway (beta-catenin) and promoted hair growth in the animals studied. Lab and animal data only, no human patients studied.</p><h4 class="pv-h">Variant 2 (question-led)</h4><p>Can restoring one signaling pathway bring hair follicles back to life? A 2024 study found promising results, in mice. Link in bio for the plain-language version.</p><h4 class="pv-h">Variant 3 (stat-led)</h4><p>Mouse model. Lab co-culture. One pathway (beta-catenin) restored. A 2024 preclinical study linked cord stem cell transplantation to hair growth in mice, an early step, not a human result yet.</p><p><i>These posts describe published preclinical research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,

  'alopecia-yu-prof': {
    title: 'Professional summary',
    kind: 'Alopecia (Preclinical)',
    html: `<h4 class="pv-h">Source</h4><p>Yu A, Zhang Y, Zhong S, et al. "Human umbilical cord mesenchymal stem cell-derived exosomes enhance follicular regeneration in androgenetic alopecia via activation of Wnt/beta-catenin pathway." <i>Stem Cell Research &amp; Therapy.</i> 2025;16:418. DOI 10.1186/s13287-025-04538-5. Open access (CC BY-NC-ND).</p><h4 class="pv-h">Study Type</h4><p><b>This is preclinical research. Mouse model and in vitro work. No human patients were treated or studied.</b></p><h4 class="pv-h">Study Design</h4><p>Preclinical laboratory study using a DHT-induced androgenetic alopecia mouse model, alongside human dermal papilla cells studied separately in culture, not in patients. Exosomes derived from human umbilical cord mesenchymal stem cells were tested for effects on hair follicle regeneration and Wnt/beta-catenin pathway activation.</p><h4 class="pv-h">Key Findings</h4><p>In the mouse model, exosome treatment was associated with enhanced hair follicle regeneration, linked to activation of the Wnt/beta-catenin signaling pathway.</p><p>In separate in vitro work with human dermal papilla cells, the same signaling pathway activation was observed in culture.</p><h4 class="pv-h">Cell Source and Product Form</h4><p>Exosomes derived from human umbilical cord mesenchymal stem cells. This is cord tissue-derived, not cord blood. The product tested was exosomes, meaning isolated extracellular vesicles, not the cells themselves. That distinction matters: a result obtained with exosomes does not establish anything about whole-cell preparations, and the reverse is equally true.</p><h4 class="pv-h">Limitations</h4><p>This is animal and laboratory data only. No human patients with androgenetic alopecia were treated or studied in this paper. Findings in a mouse model do not establish that the same effect occurs, or is safe, in humans.</p><h4 class="pv-h">Authors' Conclusion</h4><p>The paper reports a preclinical mechanistic finding: exosomes from umbilical cord mesenchymal stem cells activating Wnt/beta-catenin signaling in a mouse model of androgenetic alopecia and in cultured human dermal papilla cells. This is not a clinical or patient outcome.</p><p><i>This summary describes published preclinical research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,
    note: 'Prepared by The Thinker Intelligent System from cited public sources.'

  'alopecia-yu-lay': {
    title: 'Layperson summary',
    kind: 'Alopecia (Preclinical)',
    html: `<h4 class="pv-h">What Kind of Study This Is</h4><p><b>This is early laboratory research. It was done in mice and in cells in a dish. No people were treated or studied.</b></p><h4 class="pv-h">What They Tested</h4><p>Not stem cells themselves, but exosomes. Exosomes are tiny packages that cells release, carrying signalling molecules to other cells. Researchers collected them from human umbilical cord stem cells and tested them in mice bred to have a form of pattern hair loss, and separately on human dermal papilla cells growing in a dish.</p><h4 class="pv-h">What They Found</h4><p>In the mice, the exosomes were associated with more hair follicle regeneration, linked to activation of a signalling pathway called Wnt/beta-catenin.</p><p>In the laboratory dish work with human cells, the same pathway activation was seen.</p><h4 class="pv-h">What This Doesn't Mean</h4><p>This is animal and laboratory data only. No human patients with pattern hair loss were treated or studied.</p><p>Findings in a mouse model do not establish that the same effect occurs in people, or that it would be safe in people.</p><p>It is also worth knowing that this study tested exosomes, not cells. Those are different products, and a result with one does not tell you about the other.</p><h4 class="pv-h">Why It's Still Worth Knowing</h4><p>Exosome preparations are an active area of research precisely because they avoid some of the complications of transplanting living cells. Watching where that research goes is useful even before there are human results.</p><p><i>This summary describes published preclinical research. It is not a description of any specific clinic's services, and it is not medical advice.</i></p>`,

  },

    html: `<h4 class="pv-h">Email 1: Not cells. Exosomes.</h4><p><b>Subject:</b> A different kind of stem cell product</p><p>This is preclinical research. Mice and cells in a dish. No human patients.</p><p>What makes it worth reading is what was tested. Not stem cells, but exosomes: the small vesicles cells release to signal to other cells. Researchers collected them from human umbilical cord mesenchymal stem cells.</p><h4 class="pv-h">Email 2: The finding</h4><p><b>Subject:</b> One pathway, switched on</p><p>In a mouse model of androgenetic alopecia, exosome treatment was associated with enhanced hair follicle regeneration, linked to activation of the Wnt/beta-catenin signalling pathway.</p><p>Separate work on human dermal papilla cells in culture showed the same pathway activation.</p><h4 class="pv-h">Email 3: Why the product form matters</h4><p><b>Subject:</b> Exosomes are not cells</p><p>This distinction gets lost constantly. A study using exosomes tells you about exosomes. It does not establish anything about preparations of whole cells, and a whole-cell result tells you nothing about exosomes.</p><p>When you see cord-derived research summarised, it is worth asking three questions: which part of the cord, what type of cell, and what was actually administered. Those three answers are frequently different from what a headline implies.</p><h4 class="pv-h">Email 4: What a mouse result is and is not</h4><p><b>Subject:</b> Where this sits in the pipeline</p><p>Animal and laboratory data only. No human patients with androgenetic alopecia were treated or studied. Mouse findings do not establish human effect or human safety.</p><p>What preclinical work does show is direction: which mechanisms researchers are pursuing and which product forms they are pursuing them with. The full paper is open access at DOI 10.1186/s13287-025-04538-5.</p><p><i>These emails describe published preclinical research. They are not a description of any specific clinic's services, and they are not medical advice.</i></p>`,
