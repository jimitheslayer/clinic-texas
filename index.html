        '<h1>' + esc(D.gate.heading) + '</h1>' +
        '<p class="gsub">' + esc(D.gate.sub) + '</p>' +
        '<p>' + esc(D.gate.body) + '</p>' +
        '<input id="gatePw" type="password" autocomplete="off" placeholder="Access phrase" />' +
        '<button id="gateGo" type="button">Open dashboard</button>' +
        '<p class="gate-err" id="gateErr"></p>' +
        '<p class="gate-fine">' + esc(D.gate.fine) + '</p>' +
      '</div>';
    document.getElementById('gateGo').addEventListener('click', gateSubmit);
    document.getElementById('gatePw').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { gateSubmit(); }
    });
    document.getElementById('gatePw').focus();
  }

  /* ---------- fragments ---------- */
  function rowsHTML(rows) {
    return rows.map(function (r) {
      var right = r.full
        ? '<button class="act fv">Available in Full Version</button>'
        : '<button class="act pv" onclick="openPreviewDoc(\'' + r.key + '\')">Preview</button>' +
          '<button class="act go">Launch to your GHL</button>';
      return '<div class="wrow"><span class="wn">' + r.label + '</span>' + right + '</div>';
    }).join('');
  }

  function indicationCard(ind) {
    var body;
    if (ind.rows) {
      body =
        '<div class="src-strip"><span class="tag">Scientific source</span><span>' +
          '<span class="st-ttl">' + ind.srcTitle + '</span> ' +
          '<span class="st-code">' + ind.srcCode + '</span></span></div>' +
        '<p class="excerpt">' + ind.excerpt + '</p>' +
        '<div class="lib-head"><span class="h">Prepared content for this source</span></div>' +
        rowsHTML(ind.rows) +
        '<div class="ghl-note">' + D.ghlInd + '</div>';
    } else {
      body = '<p class="ind-collapsed-note">' + ind.placeholder + '</p>';
    }
    return '<details class="sec-item" id="' + ind.id + '">' +
      '<summary><span class="si-name">' + ind.name + '</span>' +
      '<span class="si-meta">' + ind.meta + '</span>' +
      '<span class="si-chev">&#9656;</span></summary>' +
      '<div class="sec-item-body">' + body + '</div></details>';
  }

  function railHTML() {
    var e = D.edu;
    var indLinks = D.indications.map(function (i, n) {
      return '<button class="ind-link' + (n === 0 ? ' active' : '') +
        '" onclick="openIndication(\'' + i.id + '\',event)">' + i.name +
        '<span class="meta">' + i.meta + '</span></button>';
    }).join('');
    var statLinks = D.statutes.sections.map(function (s) {
      return '<button onclick="openStatuteSection(\'' + s.id + '\')">' + s.label + '</button>';
    }).join('');
    var techItems = D.tech.items.map(function (t) {
      return '<div class="coming-item"><span class="nm">' + t.name +
        '</span><span class="soon">' + t.tag + '</span></div>';
    }).join('');
    var techChecks = D.tech.items.map(function (t) {
      return '<label class="oi-check"><input type="checkbox"> ' + t.name + '</label>';
    }).join('');

    return '<input class="rail-search" placeholder="' + D.meta.searchPlaceholder + '" />' +
      '<div class="rail-sec"><p class="lbl edu">Basic Educational Materials</p>' +
        '<div class="edu-inline"><details class="edu-item">' +
        '<summary>' + e.name + '<span class="meta">' + e.meta + '</span>' +
        '<span class="ei-chev">&#9656;</span></summary><div class="edu-item-body">' +
        '<p class="ei-desc">' + e.desc + '</p>' +
        e.links.map(function (l) { return '<a class="ei-link" href="#">' + l + '</a>'; }).join('') +
        '<p class="ei-fine">' + e.fine + '</p>' +
        '</div></details></div></div>' +

      '<details class="rail-collapse"><summary><p class="lbl sci">Indications' +
        '<span class="rc-arrow">&#9656;</span></p></summary><div class="rail-body">' +
        '<details class="rail-drop sci-drop"><summary class="rail-item drop-summary">' +
        'All indications<span class="meta">' + D.indications.length + ' listed</span>' +
        '<span class="rdc">&#9656;</span></summary>' +
        '<div class="rail-sub sci-sub">' + indLinks + '</div></details></div></details>' +

      '<details class="rail-collapse"><summary><p class="lbl law">Statutes' +
        '<span class="rc-arrow">&#9656;</span></p></summary><div class="rail-body">' +
        '<details class="rail-drop law-drop"><summary class="rail-item drop-summary">' +
        D.statutes.name + '<span class="meta">Authorization context</span>' +
        '<span class="rdc">&#9656;</span></summary>' +
        '<div class="rail-sub law-sub">' + statLinks + '</div></details></div></details>' +

      '<details class="rail-collapse" open><summary><p class="lbl cr">Clinical &amp; Regulatory' +
        '<span class="rc-arrow">&#9656;</span></p></summary><div class="rail-body">' +
        '<button class="rail-item" onclick="openConnect()">Connect with a professional' +
        '<span class="meta">Regulatory or clinician</span></button></div></details>' +

      '<details class="rail-collapse" open><summary><p class="lbl coming">Technology Section' +
        '<span class="rc-arrow">&#9656;</span></p></summary><div class="rail-body">' +
        '<div class="tech-sec">' + techItems +
        '<p class="rail-hint">' + D.tech.hint + '</p>' +
        '<div class="opt-intake"><p class="oi-h">Interested in these?</p>' +
        '<p class="oi-sub">Tell us which, and we\'ll reach out.</p>' +
        '<details class="oi-drop"><summary>Select products <span class="oi-cv">&#9662;</span></summary>' +
        techChecks + '</details>' +
        '<input class="oi-in" placeholder="Your name" />' +
        '<input class="oi-in" placeholder="Work email" />' +
        '<button class="oi-btn">Request product info</button>' +
        '<p class="oi-note">Concept, form is non-functional.</p>' +
        '</div></div></div></details>';
  }

  function contentHTML() {
    var e = D.edu;
    var eduBox =
      '<details class="sec-box edu-box2" open><summary class="sec-box-head">' +
      'Basic Educational Materials</summary><div class="sec-box-body">' +
      '<p class="excerpt">' + e.excerpt + '</p>' +
      '<div class="lib-head"><span class="h">Prepared content for this material</span></div>' +
      rowsHTML(e.rows) +
      '<div class="ghl-note">' + e.ghl + '</div></div></details>';

    var indBox =
      '<details class="sec-box sci-box"><summary class="sec-box-head">Indications</summary>' +
      '<div class="sec-box-body">' +
      D.indications.map(indicationCard).join('') +
      '</div></details>';

    var st = D.statutes;
    var statBox =
      '<details class="sec-box law-box2" id="statuteBox">' +
      '<summary class="sec-box-head">Statutes</summary><div class="sec-box-body">' +
      '<p class="sec-cite">' + st.name + ' &middot; <span class="sec-cite-meta">' +
        st.meta + '</span></p>' +
      '<p class="sec-currency">' + st.currency + '</p>' +
      '<p class="excerpt">' + st.intro + '</p>' +
      '<div class="subdrops">' +
      st.sections.map(function (s) {
        return '<details class="subdrop" id="' + s.id + '"><summary>' +
          '<span class="sd-dot law"></span>' + s.label +
          '<span class="sd-chev">&#9656;</span></summary><div class="subdrop-body">' +
          '<p class="quote-lead">' + s.lead + '</p>' +
          '<blockquote class="statute-quote">' + s.quote + '</blockquote>' +
          '<p class="q-fine">' + s.fine + '</p></div></details>';
      }).join('') +
      '</div></div></details>';

    var a = D.announcements;
    var annBox =
      '<details class="ind-panel edu-panel"><summary><span>' +
      '<span class="ind-name">' + a.heading + '</span>' +
      '<span class="ind-meta">' + a.meta + '</span></span>' +
      '<span class="chev">&#9656;</span></summary><div class="ind-body">' +
      '<div class="mode-tabs">' +
      a.modes.map(function (m, i) {
        return '<span class="mode-tab' + (i === 0 ? ' on' : '') + '">' + m + '</span>';
      }).join('') + '</div><div class="subdrops">' +
      a.items.map(function (it) {
        return '<details class="subdrop"><summary>' + it.n + ' &middot; ' + it.label +
          '<span class="sd-chev">&#9656;</span></summary><div class="subdrop-body">' +
          '<div class="preview-card"><div class="clinic-line"><span class="cl-av">YC</span>' +
          '<div><div class="cl-nm">[Your Clinic]</div>' +
          '<div class="cl-loc">' + a.clinicLoc + '</div></div></div>' +
          '<p class="msg">' + it.msg + '</p></div>' +
          '<div class="narr-actions"><button class="act go">Launch this to your GHL</button></div>' +
          '</div></details>';
      }).join('') +
      '</div><p class="mode-note">' + a.note + '</p></div></details>';

    return eduBox + indBox + statBox + annBox + D.connectHTML;
  }

  /* ---------- render ---------- */
  function render() {
    document.title = D.meta.title;
    document.getElementById('wordmark').innerHTML = D.meta.wordmark;
    document.getElementById('ctxLine').innerHTML = D.meta.ctx;
    document.getElementById('chipName').innerHTML = D.meta.chip;
    document.getElementById('thesisH').innerHTML = D.meta.thesisH;
    document.getElementById('thesisP').innerHTML = D.meta.thesisP;
    document.getElementById('rail').innerHTML = railHTML();
    document.getElementById('mainCol').innerHTML = contentHTML();
    document.getElementById('ctxCol').innerHTML = D.contextHTML;
    var img = document.getElementById('ctxPosterImg');
    if (img) { img.src = IMG_CORDBLOOD_SOCIAL; }
    wire();
  }

  /* ---------- behaviour ---------- */
  function wire() {
    var sel = document.getElementById('crSelect');
    if (sel) { sel.addEventListener('change', window.crChange); }
    document.querySelectorAll('.subdrops').forEach(function (g) {
      g.querySelectorAll('.subdrop').forEach(function (d) {
        d.addEventListener('toggle', function () {
          if (d.open) {
            g.querySelectorAll('.subdrop').forEach(function (o) { if (o !== d) o.open = false; });
          }
        });
      });
    });
    document.querySelectorAll('.sci-box .sec-item').forEach(function (d) {
      d.addEventListener('toggle', function () {
        if (d.open) {
          document.querySelectorAll('.sci-box .sec-item').forEach(function (o) {
            if (o !== d) o.open = false;
          });
        }
      });
    });
  }

  window.openIndication = function (id, e) {
    if (e) {
      document.querySelectorAll('.ind-link').forEach(function (b) { b.classList.remove('active'); });
      if (e.currentTarget) e.currentTarget.classList.add('active');
    }
    var t = document.getElementById(id);
    if (t) {
      var box = document.querySelector('.sci-box');
      if (box) box.open = true;
      document.querySelectorAll('.sci-box .sec-item').forEach(function (o) {
        if (o !== t) o.open = false;
      });
      t.open = true;
      t.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  };

  window.openStatuteSection = function (id) {
    var box = document.getElementById('statuteBox');
    if (box) { box.open = true; box.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    var sd = document.getElementById(id);
    if (sd) {
      var g = sd.closest('.subdrops');
      if (g) g.querySelectorAll('.subdrop').forEach(function (o) { if (o !== sd) o.open = false; });
      sd.open = true;
    }
  };

  window.openConnect = function () {
    var b = document.getElementById('crBox');
    if (b) { b.open = true; b.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  };

  window.closePreview = function () {
    document.querySelector('#pvOverlay .pv-card').classList.remove('wide');
    document.getElementById('pvOverlay').classList.remove('open');
  };

  window.openPreviewDoc = function (key) {
    var d = PV_DOCS[key];
    if (!d) return;
    document.getElementById('pvTitle').textContent = d.title;
    document.getElementById('pvKind').textContent = d.kind;
    document.getElementById('pvBody').innerHTML =
      (d.img ? '<img class="pv-poster" src="' + d.img + '" alt="">' : '') + d.html;
    document.getElementById('pvNote').textContent = d.note;
    document.querySelector('#pvOverlay .pv-card').classList.add('wide');
    document.getElementById('pvOverlay').classList.add('open');
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { window.closePreview(); }
  });

  /* ---------- connect dropdown ---------- */
  window.crChange = function () {
    var sel = document.getElementById('crSelect');
    var who = document.getElementById('crWho');
    var CR = {
      reg:   ['Brad Fox', 'Regulatory', '[email]'],
      clin:  ['Dr. Felix Lurye, MD', 'Clinician', '[email]'],
      clin2: ['Lisa Speer, RN', 'Clinician', '[email]'],
      clin3: ['Stacy Wright, RN', 'Clinician', '[email]']
    };
    var d = CR[sel.value];
    who.innerHTML = '<span class="cr-name">' + d[0] + '</span> ' +
      '<span class="cr-role">' + d[1] + '</span> ' +
      '<span class="cr-email">' + d[2] + '</span>';
  };

  /* ---------- boot ---------- */
  var already = false;
  try { already = sessionStorage.getItem('cp_open') === D.stamp; } catch (e) {}
  if (already) { unlock(); } else { buildGate(); }
})();

</script>
</body>
</html>
